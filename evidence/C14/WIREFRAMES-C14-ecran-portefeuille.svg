- la clé n’apparaît jamais en clair à l’écran</text><text x="54" y="320" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#1e40af;">focus() pose sur le champ - le clavier arrive au bon endroit (RGAA)</text><text x="54" y="333" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#1e40af;">autocomplete=“off” - le navigateur ne mémorise pas la clé</text><text x="30" y="60" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#1e40af;">ÉTAT 1 - Aucune clé en session</text><rect x="610" y="70" width="540" height="380" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><rect x="610" y="70" width="540" height="26" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><rect x="610" y="90" width="540" height="6" fill="#e5e7eb"/><circle cx="624" cy="83" r="4.5" fill="#ef4444"/><circle cx="638" cy="83" r="4.5" fill="#fbbf24"/><circle cx="652" cy="83" r="4.5" fill="#22c55e"/><text x="880.0" y="87" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#4b5563;">localhost:8000/app/</text><text x="624" y="116" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#111827;">RITA - Mon portefeuille</text><text x="624" y="132" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#6b7280;">Retrieval Intelligence pour le Tracking et l’Analyse</text><rect x="624" y="140" width="512" height="20" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="632" y="154" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#92400e;">Aide à la lecture. Aucune recommandation d’achat ou de vente.</text><rect x="624" y="182" width="512" height="34" rx="4" fill="#f3f4f6" stroke="#9ca3af"/><text x="634" y="204" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#374151;">Chargement du portefeuille…</text><rect x="624" y="240" width="512" height="90" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4,3"/><text x="634" y="260" style="font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:600;fill:#1e40af;">role=“status”  aria-live=“polite”</text><text x="634" y="278" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#1e40af;">Tout changement de ce texte est annoncé par un lecteur d’écran,</text><text x="634" y="292" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#1e40af;">sans interrompre la lecture en cours.</text><text x="634" y="314" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#1e40af;">Sans cela, une personne aveugle ne saurait pas que la page charge.</text><text x="610" y="60" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#1e40af;">ÉTAT 2 - Chargement en cours</text><rect x="30" y="500" width="540" height="380" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><rect x="30" y="500" width="540" height="26" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><rect x="30" y="520" width="540" height="6" fill="#e5e7eb"/><circle cx="44" cy="513" r="4.5" fill="#ef4444"/><circle cx="58" cy="513" r="4.5" fill="#fbbf24"/><circle cx="72" cy="513" r="4.5" fill="#22c55e"/><text x="300.0" y="517" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;fill:#4b5563;">localhost:8000/app/</text><text x="44" y="546" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#111827;">RITA - Mon portefeuille</text><text x="44" y="562" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#6b7280;">Retrieval Intelligence pour le Tracking et l’Analyse</text><rect x="44" y="570" width="512" height="20" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="52" y="584" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#92400e;">Aide à la lecture. Aucune recommandation d’achat ou de vente.</text><rect x="44" y="612" width="512" height="34" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="54" y="634" style="font-family:Arial,Helvetica,sans-serif;font-size:11.5px;fill:#991b1b;">Clé d’API refusée. Saisissez-la à nouveau.</text><text x="44" y="672" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;fill:#111827;">Les 3 erreurs traitées, et leur message</text><rect x="44" y="690" width="512" height="24" rx="3" fill="#fafafa" stroke="#d1d5db"/><text x="52" y="706" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;font-weight:700;fill:#dc2626;">403</text><text x="160" y="706" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#374151;">Clé refusée → on l’oublie et on redemande</text><rect x="44" y="720" width="512" height="24" rx="3" fill="#fafafa" stroke="#d1d5db"/><text x="52" y="736" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;font-weight:700;fill:#d97706;">autre code HTTP</text><text x="160" y="736" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#374151;">« Erreur NNN - le serveur n’a pas pu répondre »</text><rect x="44" y="750" width="512" height="24" rx="3" fill="#fafafa" stroke="#d1d5db"/><text x="52" y="766" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;font-weight:700;fill:#7c3aed;">aucune réponse</text><text x="160" y="766" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#374151;">« Le serveur ne répond pas » (try/catch : pas de statut à lire)</text><text x="30" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#b91c1c;">ÉTAT 3 - Erreur</text><rect x="610" y="500" width="540" height="380" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><rect x="610" y="500" width="540" height="26" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><rect x="610" y="520" width="540" height="6" fill="#e5e7eb"/><circle cx="624" cy="513" r="4.5" fill="#ef4444"/><circle cx="638" cy="513" r="4.5" fill="#fbbf24"/><circle cx="652" cy="513" r="4.5" fill="#22c55e"/><text x="880.0" y="517" text-anchor="middle" style="f