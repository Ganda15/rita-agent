<text x="932" y="292" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8px;font-style:italic;fill:#1d4ed8;">← liste déroulante de l&#x27;univers suivi (complément) :</text>
<text x="932" y="303" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8px;font-style:italic;fill:#1d4ed8;">si elle échoue, on tape le code à la main</text>
<text x="624" y="338" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;fill:#374151;">Le texte est rédigé par un modèle de langage à partir des données collectées (cours, variation,</text>
<text x="624" y="350" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;fill:#374151;">capitaux échangés, articles). Il est relu par un garde-fou avant affichage : une recommandation</text>
<text x="624" y="362" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;fill:#374151;">d&#x27;achat ou de vente est retenue, jamais diffusée.</text>
<text x="624" y="388" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;font-style:italic;fill:#1d4ed8;">champ étiqueté ; format du code contrôlé (lettres, chiffres, point, tiret, 16 signes) ; mis en majuscules</text>
