<rect x="624" y="802" width="512" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.0"/>
<text x="632" y="815" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:9px;fill:#111827;">▸ D&#x27;où vient ce texte ?   (données, modèle, garde-fou, référence)</text>
<text x="624" y="840" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8px;font-style:italic;fill:#1d4ed8;">Le focus clavier et le lecteur d&#x27;écran sont déplacés sur la région « Briefing » à l&#x27;arrivée du texte ;</text>
<text x="624" y="852" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8px;font-style:italic;fill:#1d4ed8;">le texte du modèle est inséré comme du texte (textContent), jamais comme du HTML.</text>
<text x="20" y="906" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:10px;fill:#374151;">Légende : texte bleu en italique = annotation d&#x27;accessibilité ou de comportement.</text>
