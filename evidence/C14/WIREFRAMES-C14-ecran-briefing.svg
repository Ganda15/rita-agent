<text x="52" y="683" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#111827;">Clé d&#x27;API refusée. Saisissez-la à nouveau.</text>
<text x="52" y="693" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8px;font-style:italic;fill:#1d4ed8;">→ clé oubliée, retour à l&#x27;état 1</text>
