<text x="52" y="713" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;font-weight:700;fill:#374151;">c. Code inconnu (502 « absent »)</text>
<text x="52" y="727" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#111827;">Valeur introuvable : « XX.PA » n&#x27;est pas dans l&#x27;univers suivi.</text>
<rect x="44" y="738" width="512" height="40" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.0"/>
<text x="52" y="751" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8.5px;font-weight:700;fill:#374151;">d. Aucun modèle (mesuré : 500, pas 502)</text>
<text x="52" y="765" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#111827;">Erreur 500 — le serveur n&#x27;a pas pu répondre.</text>
<text x="52" y="775" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:8px;font-style:italic;fill:#1d4ed8;">→ le message « aucun fournisseur » prévu n&#x27;apparaît jamais (corrigé le 03/10)</text>
