<text x="52" y="645" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:9.5px;fill:#111827;">Rédaction en cours pour MC.PA… Comptez quelques secondes (de 5 à 15 secondes).</text>
