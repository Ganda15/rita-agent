<g text-anchor="middle" dominant-baseline="central">
<g fill="#2C2C2A" font-size="14" font-weight="600">
<text x="340" y="52">PR ouverte</text>
<text x="145" y="128">Lint</text>
<text x="340" y="128">Secrets</text>
<text x="535" y="128">Tests</text>
<text x="340" y="218">Construire l'image</text>
<text x="340" y="308">Règle de main</text>
