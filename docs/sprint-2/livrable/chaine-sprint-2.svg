<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>La chaîne de livraison de RITA, sprint 2</title>
<desc>Une PR passe trois contrôles, puis la règle de main ; après la fusion, l'image est publiée, livrée par SSH, essayée en préproduction, puis mise en production ; trois sorties protègent la production : fusion bloquée, version refusée, retour arrière.</desc>
