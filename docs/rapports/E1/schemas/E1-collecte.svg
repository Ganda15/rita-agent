<text x="1063" y="529" font-size="14" font-weight="700" fill="#0B2A5B">RGPD (registre art. 30, db/rgpd_purge.py)</text>
<text x="1063" y="548.0" font-size="11.5" fill="#111827">traitements T1 à T5, procédures de tri P1 à P6</text>
<text x="1063" y="563.5" font-size="11.5" fill="#111827">une seule table personnelle : position</text>
<text x="1063" y="579.0" font-size="11.5" fill="#111827">fichier source hors de Git, jamais envoyé au modèle</text>
