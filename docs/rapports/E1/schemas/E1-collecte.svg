<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Segoe UI,Calibri,Arial,sans-serif">
<defs><marker id="fl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#4A5766"/></marker></defs>
<rect width="1500" height="860" fill="#FFFFFF"/>
<rect x="40" y="18" width="1420" height="3" fill="#14607F"/>
<text x="40" y="46" font-family="Georgia,serif" font-size="19" font-weight="600" fill="#16202B">RITA : la collecte multi-source, cinq types de sources sur cinq</text>
<text x="40" y="66" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#4A5766">Rapport E1, section 3 (C1) · chiffres du code lus à la génération, comptages datés · état au 4 octobre 2026</text>
<rect x="40" y="90" width="470" height="640" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="48" y="106" font-size="9.5" font-weight="700" fill="#4A5766">1. SOURCES, PAR TYPE EXIGÉ PAR C1</text>
<rect x="56" y="118" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="134" font-size="10.5" font-weight="700" fill="#16202B">SERVICE WEB · Banque centrale européenne</text>
<text x="64" y="149" font-size="9" fill="#4A5766">sources/ecb.py · taux de change contre l&#x27;euro :</text>
<text x="64" y="162" font-size="9" fill="#4A5766">USD, GBP, CHF, JPY ; zéro taux reçu = étape en échec</text>
<rect x="56" y="186" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="202" font-size="10.5" font-weight="700" fill="#16202B">SERVICE WEB · FRED (Réserve fédérale)</text>
<text x="64" y="217" font-size="9" fill="#4A5766">sources/fred.py · 3 séries macro américaines</text>
<text x="64" y="230" font-size="9" fill="#4A5766">seule source à clé, jamais écrite dans un journal</text>
<rect x="56" y="254" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="270" font-size="10.5" font-weight="700" fill="#16202B">SERVICE WEB · Yahoo Finance</text>
<text x="64" y="285" font-size="9" fill="#4A5766">sources/cotations.py · 111 valeurs, incrémental</text>
<text x="64" y="298" font-size="9" fill="#4A5766">rejouable (ON CONFLICT DO UPDATE)</text>
<rect x="56" y="322" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="338" font-size="10.5" font-weight="700" fill="#16202B">PAGE WEB (scraping) · Boursorama</text>
<text x="64" y="353" font-size="9" fill="#4A5766">sources/scraper.py · robots.txt lu et mis en cache</text>
<text x="64" y="366" font-size="9" fill="#4A5766">structure changée : exception StructurePageModifiee</text>
<rect x="56" y="390" width="438" height="58" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="64" y="406" font-size="10.5" font-weight="700" fill="#4A5766">COMPLÉMENT · flux RSS d&#x27;actualité</text>
<text x="64" y="421" font-size="9" fill="#4A5766">sources/rss.py · 3 flux généraux + 1 flux Google News</text>
<text x="64" y="434" font-size="9" fill="#4A5766">par valeur détenue (10 flux le 03/10)</text>
<rect x="56" y="470" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="486" font-size="10.5" font-weight="700" fill="#16202B">FICHIER · export courtier (CSV des positions)</text>
<text x="64" y="501" font-size="9" fill="#4A5766">sources/positions.py · « ; », cp1252, nombres à la française</text>
<text x="64" y="514" font-size="9" fill="#4A5766">seule donnée personnelle du projet</text>
<rect x="56" y="538" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="554" font-size="10.5" font-weight="700" fill="#16202B">SYSTÈME BIG DATA · Parquet + Spark</text>
<text x="64" y="569" font-size="9" fill="#4A5766">bigdata/ · dix ans de cotations, 11 partitions par année</text>
<text x="64" y="582" font-size="9" fill="#4A5766">276 168 lignes ; requêtes Spark SQL (C2)</text>
<rect x="56" y="626" width="438" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="642" font-size="10.5" font-weight="700" fill="#16202B">BASE DE DONNÉES · PostgreSQL relu</text>
<text x="64" y="657" font-size="9" fill="#4A5766">sources/database.py · requêtes paramétrées</text>
<text x="64" y="670" font-size="9" fill="#4A5766">lue par le nœud scout ; rôle rita_lecture (SELECT seul)</text>
<rect x="560" y="90" width="420" height="640" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="568" y="106" font-size="9.5" font-weight="700" fill="#4A5766">2. TRAITEMENTS</text>
<rect x="576" y="118" width="388" height="150" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="584" y="134" font-size="10.5" font-weight="700" fill="#16202B">pipelines/ingest.py : la collecte du soir</text>
<text x="584" y="149" font-size="9" fill="#4A5766">tâche planifiée Windows, chaque soir à 19 h</text>
<text x="584" y="162" font-size="9" fill="#4A5766">6 étapes : ecb, fred, cotations, rss, scraping, indexation</text>
<text x="584" y="175" font-size="9" fill="#4A5766">une étape en échec n&#x27;arrête pas les suivantes</text>
<text x="584" y="188" font-size="9" fill="#4A5766">un COMMIT par étape ; zéro ligne reçue = échec</text>
<text x="584" y="201" font-size="9" fill="#4A5766">manifeste JSON par exécution (versions, comptages)</text>
<text x="584" y="214" font-size="9" fill="#4A5766">40 journaux du 24/08 au 02/10, 33 à code 0</text>
<rect x="576" y="284" width="388" height="86" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="584" y="300" font-size="10.5" font-weight="700" fill="#16202B">Garde-fou d&#x27;injection (guardrails/injection.py)</text>
<text x="584" y="315" font-size="9" fill="#4A5766">12 motifs, appliqué aux articles RSS et scrapés</text>
<text x="584" y="328" font-size="9" fill="#4A5766">mesure du jour : 70 % de blocage, 0 % de faux positifs</text>
<text x="584" y="341" font-size="9" fill="#4A5766">article bloqué : marqué, conservé pour l&#x27;audit</text>
<rect x="576" y="470" width="388" height="126" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="584" y="486" font-size="10.5" font-weight="700" fill="#16202B">db/importer.py : l&#x27;import</text>
<text x="584" y="501" font-size="9" fill="#4A5766">archive Parquet : dédoublonnage (ticker, date),</text>
<text x="584" y="514" font-size="9" fill="#4A5766">  alias de portefeuille résolus (voir C3)</text>
<text x="584" y="527" font-size="9" fill="#4A5766">positions : réconciliation ; une ligne retirée</text>
<text x="584" y="540" font-size="9" fill="#4A5766">  du fichier est close à la date du jour,</text>
<text x="584" y="553" font-size="9" fill="#4A5766">  jamais supprimée</text>
<rect x="576" y="626" width="388" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="584" y="642" font-size="10.5" font-weight="700" fill="#16202B">Lecture, sans écriture</text>
<text x="584" y="657" font-size="9" fill="#4A5766">le scout lit la base pour chaque briefing ;</text>
<text x="584" y="670" font-size="9" fill="#4A5766">Spark lit le Parquet sans passer par la base</text>
<rect x="1030" y="90" width="430" height="640" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="1038" y="106" font-size="9.5" font-weight="700" fill="#4A5766">3. DESTINATION ET CONFORMITÉ</text>
<rect x="1046" y="118" width="398" height="120" fill="#D8E3EA" stroke="none" stroke-width="1.2"/>
<text x="1054" y="134" font-size="10.5" font-weight="700" fill="#16202B">PostgreSQL 18 (Merise, C4)</text>
<text x="1054" y="149" font-size="9" fill="#4A5766">10 tables, 1 vue, 12 contraintes CHECK</text>
<text x="1054" y="162" font-size="9" fill="#4A5766">écrit par la collecte et l&#x27;import, seulement</text>
<text x="1054" y="175" font-size="9" fill="#4A5766">278 473 cotations (29/07/2016 au 02/10/2026)</text>
<text x="1054" y="188" font-size="9" fill="#4A5766">1 563 articles ; séries FRED stockées</text>
<text x="1054" y="201" font-size="9" fill="#4A5766">servi par l&#x27;API /donnees/* (C5)</text>
<rect x="1046" y="254" width="398" height="58" fill="#D8E3EA" stroke="none" stroke-width="1.2"/>
<text x="1054" y="270" font-size="10.5" font-weight="700" fill="#16202B">Index ChromaDB (étape indexation)</text>
<text x="1054" y="285" font-size="9" fill="#4A5766">articles vectorisés pour la recherche documentaire</text>
<text x="1054" y="298" font-size="9" fill="#4A5766">reconstruit après chaque collecte</text>
<rect x="1046" y="470" width="398" height="126" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="1054" y="486" font-size="10.5" font-weight="700" fill="#16202B">RGPD (registre art. 30, db/rgpd_purge.py)</text>
<text x="1054" y="501" font-size="9" fill="#4A5766">traitements T1 à T5, procédures de tri P1 à P6</text>
<text x="1054" y="514" font-size="9" fill="#4A5766">une seule table personnelle : position</text>
<text x="1054" y="527" font-size="9" fill="#4A5766">fichier source hors de Git, jamais envoyé au modèle</text>
<text x="1054" y="540" font-size="9" fill="#4A5766">purge en simulation par défaut ;</text>
<text x="1054" y="553" font-size="9" fill="#4A5766">lancement manuel, écrit comme tel</text>
<rect x="40" y="750" width="1420" height="56" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="48" y="766" font-size="10.5" font-weight="700" fill="#4A5766">Couverture de C1 : service web ✓ · page web ✓ · fichier ✓ · base de données ✓ · système big data ✓</text>
<text x="48" y="781" font-size="9" fill="#4A5766">Cinq types sur cinq, plus le RSS en complément. Une preuve par source dans evidence/C1/ ; la figure du 11/08 qui s&#x27;y trouve est une preuve datée : ses chiffres de tables et de garde-fou ne sont plus à jour.</text>
