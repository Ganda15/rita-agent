<text x="40" y="844" font-size="9" fill="#4A5766">Bleu clair : code qui écrit en base. Gris : réserves de données. Blanc : source ou lecture. Génération : docs/rapports/E1/schemas/generer_schemas.py, vérifiée par tests/test_schemas_e1.py.</text>
