<line x1="1040" y1="581.0" x2="1064" y2="581.0" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="40" y="804" font-size="9" fill="#4A5766">Blanc : défaut mesuré. Bleu clair : décision appliquée. Pointillé orange : limite déclarée, ou décision conçue non construite. Gris : fichier ou preuve à ouvrir. Chiffres de juillet et du 02/10 : rapport E1, section 4.</text>
