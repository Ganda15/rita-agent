<text x="54" y="186" font-size="14.5" font-weight="700" fill="#4C1D95">SGBD · PostgreSQL 18 (Merise, C4)</text>
<text x="54" y="208" font-size="12" fill="#111827" xml:space="preserve">10 tables, 278 473 cotations au 02/10/2026</text>
<text x="54" y="225" font-size="12" fill="#111827" xml:space="preserve">clé primaire (ticker, date_seance), index sur la date</text>
<text x="54" y="242" font-size="12" fill="#111827" xml:space="preserve">sources/database.py : les requêtes de db/requetes.sql,</text>
<text x="54" y="259" font-size="12" fill="#111827" xml:space="preserve">  valeurs passées par %(nom)s, jamais concaténées</text>
<rect x="34" y="361" width="422" height="130" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="32" y="358" width="422" height="130" rx="7" fill="#F1EAFE" stroke="#6D28D9" stroke-width="1.6"/>
<rect x="32" y="358" width="8" height="130" rx="3" fill="#6D28D9"/>
<text x="54" y="384" font-size="14.5" font-weight="700" fill="#4C1D95">SYSTÈME BIG DATA · Parquet + Spark</text>
<text x="54" y="406" font-size="12" fill="#111827" xml:space="preserve">data/bigdata/ohlcv/annee=AAAA/ : 11 partitions</text>
<text x="54" y="423" font-size="12" fill="#111827" xml:space="preserve">276 168 lignes, 111 valeurs, 14 Mo (comptés le 27/10)</text>
<text x="54" y="440" font-size="12" fill="#111827" xml:space="preserve">du 29/07/2016 au 29/07/2026, écrit par build_parquet.py</text>
<text x="54" y="457" font-size="12" fill="#111827" xml:space="preserve">Spark en local[*], 8 partitions de shuffle (et non 200)</text>
<rect x="34" y="541" width="422" height="130" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="32" y="538" width="422" height="130" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<rect x="32" y="538" width="8" height="130" rx="3" fill="#475569"/>
<text x="54" y="564" font-size="14.5" font-weight="700" fill="#0B2A5B">Lignes par partition (comptées le 27/10)</text>
<text x="54" y="586" font-size="12" fill="#111827" xml:space="preserve">2016 : 11 980 · 2017 : 27 770 · 2018 : 27 610</text>
<text x="54" y="603" font-size="12" fill="#111827" xml:space="preserve">2019 : 27 463 · 2020 : 27 488 · 2021 : 27 589</text>
<text x="54" y="620" font-size="12" fill="#111827" xml:space="preserve">2022 : 27 480 · 2023 : 27 454 · 2024 : 27 648</text>
<text x="54" y="637" font-size="12" fill="#111827" xml:space="preserve">2025 : 27 783 · 2026 : 15 903</text>
<text x="54" y="654" font-size="12" fill="#111827" xml:space="preserve">2016 et 2026 incomplètes : dix ans depuis le 29/07/2016</text>
<rect x="580" y="163" width="360" height="178" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="578" y="160" width="360" height="178" rx="7" fill="#E3F0FD" stroke="#1565C0" stroke-width="1.6"/>
<rect x="578" y="160" width="8" height="178" rx="3" fill="#1565C0"/>
<text x="600" y="186" font-size="14.5" font-weight="700" fill="#0B2A5B">db/requetes.sql : le SQL de PostgreSQL</text>
<text x="600" y="208" font-size="12" fill="#111827" xml:space="preserve">R1 portefeuille en euros : LEFT JOIN LATERAL,</text>
<text x="600" y="225" font-size="12" fill="#111827" xml:space="preserve">  dernier cours de chaque valeur, dernier taux</text>
<text x="600" y="242" font-size="12" fill="#111827" xml:space="preserve">R1 bis positions closes, pour le propriétaire seul</text>
<text x="600" y="259" font-size="12" fill="#111827" xml:space="preserve">R2 plus fortes variations : LAG() par valeur,</text>
<text x="600" y="276" font-size="12" fill="#111827" xml:space="preserve">  filtre de date avant la fenêtre, statut OK</text>
<text x="600" y="293" font-size="12" fill="#111827" xml:space="preserve">R3 volumes anormaux : moyenne des 20 séances</text>
<text x="600" y="310" font-size="12" fill="#111827" xml:space="preserve">  précédentes, sur les 60 derniers jours</text>
<rect x="580" y="361" width="360" height="160" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="578" y="358" width="360" height="160" rx="7" fill="#E3F0FD" stroke="#1565C0" stroke-width="1.6"/>
<rect x="578" y="358" width="8" height="160" rx="3" fill="#1565C0"/>
<text x="600" y="384" font-size="14.5" font-weight="700" fill="#0B2A5B">bigdata/query_spark.py : Spark SQL</text>
<text x="600" y="406" font-size="12" fill="#111827" xml:space="preserve">S1 volumétrie : GROUP BY annee, sans filtre</text>
<text x="600" y="423" font-size="12" fill="#111827" xml:space="preserve">S2 amplitude moyenne : WHERE annee &gt;= 2024,</text>
<text x="600" y="440" font-size="12" fill="#111827" xml:space="preserve">  HAVING COUNT(*) &gt;= 200 séances</text>
<text x="600" y="457" font-size="12" fill="#111827" xml:space="preserve">S3 meilleure séance : WHERE annee &gt;= 2025,</text>
<text x="600" y="474" font-size="12" fill="#111827" xml:space="preserve">  LAG() puis RANK() OVER (PARTITION BY ticker)</text>
<text x="600" y="491" font-size="12" fill="#111827" xml:space="preserve">le même vocabulaire que PostgreSQL, un autre moteur</text>
<rect x="580" y="541" width="360" height="100" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="578" y="538" width="360" height="100" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
<rect x="578" y="538" width="8" height="100" rx="3" fill="#1E293B"/>
<text x="600" y="564" font-size="14.5" font-weight="700" fill="#0B2A5B">Les choix, écrits devant chaque requête</text>
<text x="600" y="586" font-size="12" fill="#111827" xml:space="preserve">OBJECTIF, CHOIX (sélection, jointure, filtre),</text>
<text x="600" y="603" font-size="12" fill="#111827" xml:space="preserve">OPTIMISATION, dans les deux fichiers</text>
<text x="600" y="620" font-size="12" fill="#111827" xml:space="preserve">sorties réelles : evidence/C2/preuve-requetes-sql.md</text>
<rect x="1074" y="163" width="396" height="178" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="1072" y="160" width="396" height="178" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<rect x="1072" y="160" width="8" height="178" rx="3" fill="#475569"/>
<text x="1094" y="186" font-size="14.5" font-weight="700" fill="#0B2A5B">PostgreSQL : EXPLAIN ANALYZE (août 2026)</text>
<text x="1094" y="208" font-size="12" fill="#111827" xml:space="preserve">dernier cours des 111 valeurs :</text>
<text x="1094" y="225" font-size="12" fill="#111827" xml:space="preserve">  DISTINCT ON 295,19 ms, LATERAL 1,19 ms</text>
<text x="1094" y="242" font-size="12" fill="#111827" xml:space="preserve">les 7 positions : CTE DISTINCT ON 258,00 ms,</text>
<text x="1094" y="259" font-size="12" fill="#111827" xml:space="preserve">  sous-requête corrélée 0,12 ms, LATERAL 0,24 ms</text>
<text x="1094" y="276" font-size="12" fill="#111827" xml:space="preserve">DISTINCT ON triait les 273 608 cotations ;</text>
<text x="1094" y="293" font-size="12" fill="#111827" xml:space="preserve">  LATERAL va chercher par l&#x27;index (cotation_pkey)</text>
<text x="1094" y="310" font-size="12" fill="#111827" xml:space="preserve">l&#x27;optimisation prévue était la mauvaise</text>
<rect x="1074" y="361" width="396" height="160" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="1072" y="358" width="396" height="160" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<rect x="1072" y="358" width="8" height="160" rx="3" fill="#475569"/>
<text x="1094" y="384" font-size="14.5" font-weight="700" fill="#0B2A5B">Spark : ce que lit chaque requête (plan)</text>
<text x="1094" y="406" font-size="12" fill="#111827" xml:space="preserve">S1 lit 11/11 partitions : 276 168 lignes</text>
<text x="1094" y="423" font-size="12" fill="#111827" xml:space="preserve">S2 lit 3/11 : 71 334 lignes, 8 fichiers jamais ouverts</text>
<text x="1094" y="440" font-size="12" fill="#111827" xml:space="preserve">S3 lit 2/11 : 43 686 lignes, 9 fichiers jamais ouverts</text>
<text x="1094" y="457" font-size="12" fill="#111827" xml:space="preserve">preuve dans le plan, pour annee = 2024 :</text>
<text x="1094" y="474" font-size="12" fill="#111827" xml:space="preserve">  PartitionFilters: [isnotnull(annee), (annee = 2024)]</text>
<text x="1094" y="491" font-size="12" fill="#111827" xml:space="preserve">  1 fichier ouvert sur 11, 27 648 lignes</text>
<text x="1094" y="508" font-size="12" fill="#111827" xml:space="preserve">coût qui reste : le shuffle (GROUP BY, PARTITION BY)</text>
<rect x="1074" y="541" width="396" height="100" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="1072" y="538" width="396" height="100" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
<rect x="1072" y="538" width="8" height="100" rx="3" fill="#1E293B"/>
<text x="1094" y="564" font-size="14.5" font-weight="700" fill="#0B2A5B">Optimiser ne veut pas dire la même chose</text>
<text x="1094" y="586" font-size="12" fill="#111827" xml:space="preserve">PostgreSQL : choisir le bon chemin d&#x27;accès, l&#x27;index</text>
<text x="1094" y="603" font-size="12" fill="#111827" xml:space="preserve">Spark : ne pas ouvrir les partitions inutiles</text>
<text x="1094" y="620" font-size="12" fill="#111827" xml:space="preserve">ce qui coûte : trier toute la table / le shuffle</text>
<rect x="22" y="709" width="1460" height="66" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="20" y="706" width="1460" height="66" rx="7" fill="#E8F5E9" stroke="#15803D" stroke-width="1.6"/>
<rect x="20" y="706" width="8" height="66" rx="3" fill="#15803D"/>
<text x="42" y="732" font-size="14.5" font-weight="700" fill="#14532D">Couverture de C2 : requêtes fonctionnelles ✓ · choix documentés ✓ · optimisations expliquées ✓</text>
<text x="42" y="754" font-size="12" fill="#111827" xml:space="preserve">SGBD et système big data, chacun dans son langage. Limite : 276 168 lignes et 14 Mo ne sont pas du big data ; la méthode est montrée en local (cadrage accepté par le formateur en août).</text>
