<rect x="1068" y="112" width="404" height="34" rx="7" fill="#475569"/>
<text x="1082" y="134" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">3. LE COÛT, MESURÉ</text>
