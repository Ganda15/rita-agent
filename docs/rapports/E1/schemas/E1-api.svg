<text x="36" y="56" font-size="30" font-weight="700" fill="#0B2A5B">RITA : servir le jeu de données, une API REST protégée par une clé</text>
<text x="36" y="84" font-size="15" fill="#1F2937">Rapport E1, section 7 (C5) · routes et contrat lus dans le code à la génération · état au 27 octobre 2026</text>
<rect x="20" y="104" width="446" height="590" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="28" y="112" width="430" height="34" rx="7" fill="#0B2A5B"/>
<text x="42" y="134" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">1. LES CLIENTS DU JEU DE DONNÉES</text>
<rect x="566" y="104" width="384" height="590" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="574" y="112" width="368" height="34" rx="7" fill="#1565C0"/>
<text x="588" y="134" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">2. L&#x27;API REST (FastAPI)</text>
<rect x="1060" y="104" width="420" height="590" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="1068" y="112" width="404" height="34" rx="7" fill="#6D28D9"/>
<text x="1082" y="134" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">3. DONNÉES, CONTRAT ET PREUVES</text>
<rect x="34" y="163" width="422" height="100" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="32" y="160" width="422" height="100" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
<rect x="32" y="160" width="8" height="100" rx="3" fill="#1E293B"/>
<text x="54" y="186" font-size="14.5" font-weight="700" fill="#0B2A5B">Interface web (frontend/)</text>
<text x="54" y="208" font-size="12" fill="#111827" xml:space="preserve">écrans : portefeuille, indicateurs, risque, fraîcheur,</text>
<text x="54" y="225" font-size="12" fill="#111827" xml:space="preserve">  valeurs, fiche d&#x27;un article cité</text>
<text x="54" y="242" font-size="12" fill="#111827" xml:space="preserve">clé saisie à l&#x27;écran, jamais écrite dans frontend/</text>
<rect x="34" y="279" width="422" height="100" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="32" y="276" width="422" height="100" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
<rect x="32" y="276" width="8" height="100" rx="3" fill="#1E293B"/>
<text x="54" y="302" font-size="14.5" font-weight="700" fill="#0B2A5B">Passerelle MCP (passerelle_mcp/serveur.py)</text>
<text x="54" y="324" font-size="12" fill="#111827" xml:space="preserve">3 outils : rita_fraicheur, rita_portefeuille,</text>
<text x="54" y="341" font-size="12" fill="#111827" xml:space="preserve">  rita_indicateurs ; trois lectures, avec la clé</text>
<rect x="34" y="395" width="422" height="90" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="32" y="392" width="422" height="90" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
<rect x="32" y="392" width="8" height="90" rx="3" fill="#1E293B"/>
<text x="54" y="418" font-size="14.5" font-weight="700" fill="#0B2A5B">Contrôle après livraison (deploy/deployer.py)</text>
<text x="54" y="440" font-size="12" fill="#111827" xml:space="preserve">sans clé, GET /donnees/valeurs doit répondre 403,</text>
<text x="54" y="457" font-size="12" fill="#111827" xml:space="preserve">  sinon le contrôle de la livraison échoue</text>
<rect x="34" y="501" width="422" height="90" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="32" y="498" width="422" height="90" rx="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6"/>
<rect x="32" y="498" width="8" height="90" rx="3" fill="#1E293B"/>
<text x="54" y="524" font-size="14.5" font-weight="700" fill="#0B2A5B">curl et navigateur : /docs</text>
<text x="54" y="546" font-size="12" fill="#111827" xml:space="preserve">le contrat essayé à l&#x27;écran (Swagger UI)</text>
<text x="54" y="563" font-size="12" fill="#111827" xml:space="preserve">la clé se colle une fois, dans « Authorize »</text>
<rect x="580" y="163" width="360" height="130" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="578" y="160" width="360" height="130" rx="7" fill="#E3F0FD" stroke="#1565C0" stroke-width="1.6"/>
<rect x="578" y="160" width="8" height="130" rx="3" fill="#1565C0"/>
<text x="600" y="186" font-size="14.5" font-weight="700" fill="#0B2A5B">api/main.py : la clé sur tout le routeur</text>
<text x="600" y="208" font-size="12" fill="#111827" xml:space="preserve">include_router(routeur_donnees,</text>
<text x="600" y="225" font-size="12" fill="#111827" xml:space="preserve">  dependencies=[Depends(verify_api_key)])</text>
<text x="600" y="242" font-size="12" fill="#111827" xml:space="preserve">une route ajoutée est protégée d&#x27;office</text>
<text x="600" y="259" font-size="12" fill="#111827" xml:space="preserve">X-Request-ID sur toute réponse, refus compris</text>
<rect x="580" y="319" width="360" height="150" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="578" y="316" width="360" height="150" rx="7" fill="#FFF1E6" stroke="#C2410C" stroke-width="1.6"/>
<rect x="578" y="316" width="8" height="150" rx="3" fill="#C2410C"/>
<text x="600" y="342" font-size="14.5" font-weight="700" fill="#9A3412">Contrôle d&#x27;accès : verify_api_key</text>
<text x="600" y="364" font-size="12" fill="#111827" xml:space="preserve">en-tête X-API-Key, comparé par compare_digest</text>
<text x="600" y="381" font-size="12" fill="#111827" xml:space="preserve">absente ou fausse : 403, une ligne de journal,</text>
<text x="600" y="398" font-size="12" fill="#111827" xml:space="preserve">  jamais la clé, ni un morceau</text>
<text x="600" y="415" font-size="12" fill="#111827" xml:space="preserve">clé d&#x27;au moins 16 caractères, sans défaut</text>
<rect x="580" y="515" width="360" height="165" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="578" y="512" width="360" height="165" rx="7" fill="#E3F0FD" stroke="#1565C0" stroke-width="1.6"/>
<rect x="578" y="512" width="8" height="165" rx="3" fill="#1565C0"/>
<text x="600" y="538" font-size="14.5" font-weight="700" fill="#0B2A5B">api/donnees.py : 12 points de terminaison</text>
<text x="600" y="560" font-size="12" fill="#111827" xml:space="preserve">/valeurs · /cotations · /macro · /portefeuille</text>
<text x="600" y="577" font-size="12" fill="#111827" xml:space="preserve">/mouvements · /volumes-anormaux · /indicateurs</text>
<text x="600" y="594" font-size="12" fill="#111827" xml:space="preserve">/indicateurs-portefeuille · /indicateurs-risque</text>
<text x="600" y="611" font-size="12" fill="#111827" xml:space="preserve">/articles · /articles/{article_id} · /fraicheur</text>
<text x="600" y="628" font-size="12" fill="#111827" xml:space="preserve">pages de 1 000 lignes au plus ; /cotations : jusqu_a</text>
<text x="600" y="645" font-size="12" fill="#111827" xml:space="preserve">422 saisie invalide, 404 ticker ou article inconnu</text>
<rect x="1074" y="163" width="396" height="110" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="1072" y="160" width="396" height="110" rx="7" fill="#F1EAFE" stroke="#6D28D9" stroke-width="1.6"/>
<rect x="1072" y="160" width="8" height="110" rx="3" fill="#6D28D9"/>
<text x="1094" y="186" font-size="14.5" font-weight="700" fill="#4C1D95">PostgreSQL 18, en lecture seule</text>
<text x="1094" y="208" font-size="12" fill="#111827" xml:space="preserve">sources/database.py : les requêtes de db/requetes.sql</text>
<text x="1094" y="225" font-size="12" fill="#111827" xml:space="preserve">indicateurs/ : calculs déterministes, sans modèle</text>
<text x="1094" y="242" font-size="12" fill="#111827" xml:space="preserve">aucune route de /donnees n&#x27;écrit en base</text>
<rect x="1074" y="303" width="396" height="100" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="1072" y="300" width="396" height="100" rx="7" fill="#F1EAFE" stroke="#6D28D9" stroke-width="1.6"/>
<rect x="1072" y="300" width="8" height="100" rx="3" fill="#6D28D9"/>
<text x="1094" y="326" font-size="14.5" font-weight="700" fill="#4C1D95">Contrat OpenAPI 3.1.0, généré par FastAPI</text>
<text x="1094" y="348" font-size="12" fill="#111827" xml:space="preserve">19 chemins, dont 12 sous /donnees</text>
<text x="1094" y="365" font-size="12" fill="#111827" xml:space="preserve">schéma de sécurité APIKeyHeader déclaré</text>
<text x="1094" y="382" font-size="12" fill="#111827" xml:space="preserve">/openapi.json et /docs, tenus à jour par le code</text>
<rect x="1074" y="563" width="396" height="120" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="1072" y="560" width="396" height="120" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1.6"/>
<rect x="1072" y="560" width="8" height="120" rx="3" fill="#475569"/>
<text x="1094" y="586" font-size="14.5" font-weight="700" fill="#0B2A5B">Les preuves : tests/test_api_donnees.py</text>
<text x="1094" y="608" font-size="12" fill="#111827" xml:space="preserve">39 fonctions de test, dont :</text>
<text x="1094" y="625" font-size="12" fill="#111827" xml:space="preserve">chaque route de /donnees, sans clé : 403</text>
<text x="1094" y="642" font-size="12" fill="#111827" xml:space="preserve">2 600 séances relues par pages de 1 000,</text>
<text x="1094" y="659" font-size="12" fill="#111827" xml:space="preserve">  sans trou ni doublon</text>
<rect x="22" y="715" width="1460" height="66" rx="7" fill="#0F172A" opacity="0.06"/>
<rect x="20" y="712" width="1460" height="66" rx="7" fill="#E8F5E9" stroke="#15803D" stroke-width="1.6"/>
<rect x="20" y="712" width="8" height="66" rx="3" fill="#15803D"/>
<text x="42" y="738" font-size="14.5" font-weight="700" fill="#14532D">Couverture de C5 : points de terminaison documentés ✓ · authentification documentée ✓ · standard OpenAPI ✓ · accès restreint ✓ · jeu complet ✓</text>
<text x="42" y="760" font-size="12" fill="#111827" xml:space="preserve">Limite : une seule clé partagée, sans droits par utilisateur (décision D10) ; pas de quota sur /donnees, seulement sur /briefing et /question, qui appellent le modèle.</text>
