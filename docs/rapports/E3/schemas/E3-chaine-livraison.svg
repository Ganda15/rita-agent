<text x="1008" y="396" font-size="9.5" font-weight="700" fill="#4A5766">CONÇU, NON CONSTRUIT (Mardik ③, Industrialisation)</text>
<rect x="1016" y="408" width="328" height="44" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="1024" y="424" font-size="10.5" font-weight="700" fill="#9E4318">rollback.yml : retour arrière</text>
<text x="1024" y="439" font-size="9" fill="#4A5766">tag précédent redéployé, jamais reconstruit</text>
<rect x="1016" y="462" width="328" height="44" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="1024" y="478" font-size="10.5" font-weight="700" fill="#9E4318">Manifeste de version, GET /version</text>
<text x="1024" y="493" font-size="9" fill="#4A5766">modèle daté, prompt_version, config, index</text>
<rect x="1016" y="516" width="328" height="44" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="1024" y="532" font-size="10.5" font-weight="700" fill="#9E4318">Filtre de chemin + gate sur le vrai modèle</text>
<text x="1024" y="547" font-size="9" fill="#4A5766">porte payante seulement si prompt ou jeu changent</text>
<rect x="40" y="380" width="260" height="100" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="48" y="396" font-size="10.5" font-weight="700" fill="#4A5766">Ce que la chaîne coche pour C13</text>
<text x="48" y="411" font-size="9" fill="#4A5766">test → construction → démarrage vérifié →</text>
<text x="48" y="424" font-size="9" fill="#4A5766">accès vérifié → publication sur tag,</text>
<text x="48" y="437" font-size="9" fill="#4A5766">exécuté par la plateforme à chaque poussée.</text>
<text x="48" y="450" font-size="9" fill="#4A5766">Un Dockerfile seul ne coche aucun critère.</text>
<rect x="40" y="500" width="260" height="90" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="48" y="516" font-size="10.5" font-weight="700" fill="#4A5766">Chute réelle de la CI, 28/09</text>
<text x="48" y="531" font-size="9" fill="#4A5766">requirements.txt non épinglé : pip a</text>
<text x="48" y="544" font-size="9" fill="#4A5766">construit pandas depuis les sources.</text>
<text x="48" y="557" font-size="9" fill="#4A5766">Cause identifiée, correction en attente (#23).</text>
