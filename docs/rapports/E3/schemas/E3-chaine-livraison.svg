<text x="373" y="357" font-size="14" font-weight="700" fill="#0B2A5B">livraison.yml : poussée, PR, et tag livrable-*</text>
<text x="373" y="376.0" font-size="11.5" fill="#111827">1. tests, porte de livraison (rien n&#x27;est construit si rouge)</text>
<text x="373" y="391.5" font-size="11.5" fill="#111827">2. construction de l&#x27;image, jamais publiée ici</text>
