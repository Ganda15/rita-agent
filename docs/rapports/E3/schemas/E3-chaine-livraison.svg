<text x="373" y="438.0" font-size="11.5" fill="#111827">5. publication sur ghcr.io/ganda15/rita-api, seulement sur un tag</text>
<text x="373" y="453.5" font-size="11.5" fill="#111827">   (issue #22 : avant, la publication précédait la vérification)</text>
