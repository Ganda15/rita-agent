<text x="373" y="173.5" font-size="11.5" fill="#111827">  2. suite + couverture ≥ 90 % (.coveragerc)</text>
<text x="373" y="189.0" font-size="11.5" fill="#111827">job evals : garde-fous mesurés,</text>
<text x="373" y="204.5" font-size="11.5" fill="#111827">  portes non compensables (xfail strict à 85 %)</text>
<text x="373" y="220.0" font-size="11.5" fill="#111827">778 passed, 29 skipped, 94,70 % (04/10)</text>
