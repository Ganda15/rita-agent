<text x="1024" y="134" font-size="10.5" font-weight="700" fill="#16202B">docker compose (manuel, par SSH)</text>
<text x="1024" y="149" font-size="9" fill="#4A5766">pull de l&#x27;image taguée, up -d --force-recreate api</text>
<text x="1024" y="162" font-size="9" fill="#4A5766">conteneur en lecture seule, no-new-privileges</text>
<text x="1024" y="175" font-size="9" fill="#4A5766">variables Langfuse transmises depuis le 02/10</text>
