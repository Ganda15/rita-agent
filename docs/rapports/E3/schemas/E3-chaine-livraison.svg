<rect x="56" y="118" width="228" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="134" font-size="10.5" font-weight="700" fill="#16202B">Branche develop</text>
<text x="64" y="149" font-size="9" fill="#4A5766">un commit = une intention</text>
<text x="64" y="162" font-size="9" fill="#4A5766">tests écrits avant le code (TDD)</text>
<text x="64" y="175" font-size="9" fill="#4A5766">git push origin develop</text>
<rect x="56" y="202" width="228" height="60" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="218" font-size="10.5" font-weight="700" fill="#16202B">Hook pre-push (.githooks/)</text>
<text x="64" y="233" font-size="9" fill="#4A5766">refuse la poussée directe sur main</text>
<text x="64" y="246" font-size="9" fill="#4A5766">activé une fois par clone</text>
<rect x="56" y="276" width="228" height="60" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="292" font-size="10.5" font-weight="700" fill="#16202B">scripts/verifier_livrable.py</text>
<text x="64" y="307" font-size="9" fill="#4A5766">Definition of Done : tests, liens,</text>
<text x="64" y="320" font-size="9" fill="#4A5766">ETAT et CHANGELOG, arbre propre</text>
<rect x="340" y="90" width="620" height="500" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="348" y="106" font-size="9.5" font-weight="700" fill="#4A5766">GITHUB (dépôt privé Ganda15/rita-agent)</text>
<rect x="356" y="118" width="280" height="100" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="134" font-size="10.5" font-weight="700" fill="#16202B">test.yml : à chaque poussée et PR</text>
<text x="364" y="149" font-size="9" fill="#4A5766">job pytest : suite + couverture ≥ 90 %</text>
<text x="364" y="162" font-size="9" fill="#4A5766">  (seuil dans .coveragerc, --cov sur la commande)</text>
<text x="364" y="175" font-size="9" fill="#4A5766">job evals : garde-fous mesurés,</text>
<text x="364" y="188" font-size="9" fill="#4A5766">  portes non compensables (xfail strict à 85 %)</text>
<text x="364" y="201" font-size="9" fill="#4A5766">626 passed, 93,66 % le 02/10</text>
<rect x="664" y="118" width="280" height="100" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="672" y="134" font-size="10.5" font-weight="700" fill="#16202B">revue-pr.yml : chaque PR vers main</text>
<text x="672" y="149" font-size="9" fill="#4A5766">relecture adversariale automatisée</text>
<text x="672" y="162" font-size="9" fill="#4A5766">(action officielle, jeton d&#x27;abonnement en secret)</text>
<text x="672" y="175" font-size="9" fill="#4A5766">grille de lecture : AGENTS.md et les règles du dépôt</text>
<text x="672" y="188" font-size="9" fill="#4A5766">22 PR fusionnées au 02/10</text>
<rect x="356" y="236" width="280" height="56" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="252" font-size="10.5" font-weight="700" fill="#16202B">Branche main</text>
<text x="364" y="267" font-size="9" fill="#4A5766">ne bouge que par une PR depuis develop</text>
<text x="364" y="280" font-size="9" fill="#4A5766">un livrable = un tag livrable-E&lt;n&gt;-v&lt;k&gt;</text>
<rect x="356" y="310" width="588" height="120" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="326" font-size="10.5" font-weight="700" fill="#16202B">livraison.yml : poussée, PR, et tag livrable-*</text>
<text x="364" y="341" font-size="9" fill="#4A5766">1. tests, porte de livraison (rien n&#x27;est construit si rouge)</text>
<text x="364" y="354" font-size="9" fill="#4A5766">2. construction de l&#x27;image, jamais publiée ici</text>
<text x="364" y="367" font-size="9" fill="#4A5766">3. l&#x27;image construite démarre et répond sur /health</text>
<text x="364" y="380" font-size="9" fill="#4A5766">4. l&#x27;accès est restreint : 403 sans clé</text>
<text x="364" y="393" font-size="9" fill="#4A5766">5. publication sur ghcr.io/ganda15/rita-api, seulement sur un tag (issue #22 : avant, la publication précédait la vérification)</text>
<rect x="664" y="236" width="280" height="56" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="672" y="252" font-size="10.5" font-weight="700" fill="#16202B">scan-giskard.yml : manuel</text>
<text x="672" y="267" font-size="9" fill="#4A5766">scan d&#x27;attaques, deux frontières</text>
<text x="672" y="280" font-size="9" fill="#4A5766">plafond de coût saisi ; run 9 le 20/09</text>
<rect x="664" y="524" width="280" height="60" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="672" y="540" font-size="10.5" font-weight="700" fill="#16202B">alerte-incident.yml</text>
<text x="672" y="555" font-size="9" fill="#4A5766">reçu de Langfuse (repository_dispatch)</text>
<text x="672" y="568" font-size="9" fill="#4A5766">ou bouton manuel ; ouvre ou commente</text>
<text x="672" y="581" font-size="9" fill="#4A5766">une issue « incident » ; label créé</text>
<rect x="356" y="446" width="588" height="70" fill="#D8E3EA" stroke="none" stroke-width="1.2"/>
<text x="364" y="462" font-size="10.5" font-weight="700" fill="#16202B">Image sur GHCR</text>
<text x="364" y="477" font-size="9" fill="#4A5766">python:3.13-slim, deux étapes, non-root (UID 10001)</text>
<text x="364" y="490" font-size="9" fill="#4A5766">ghcr.io/ganda15/rita-api:livrable-E&lt;n&gt;-v&lt;k&gt;</text>
<text x="364" y="503" font-size="9" fill="#4A5766">jamais publiée pour de vrai au 03/10</text>
