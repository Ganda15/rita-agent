<rect width="1400" height="560" fill="#FFFFFF"/>
<rect x="40" y="18" width="1320" height="3" fill="#14607F"/>
<text x="40" y="46" font-family="Georgia,serif" font-size="19" font-weight="600" fill="#16202B">RITA : surveiller le modèle, collecte, alerte et restitution</text>
<text x="40" y="66" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#4A5766">Rapport E3, section 5 · src/traces.py, Langfuse Cloud (région UE), GitHub Actions · état au 4 octobre 2026</text>
<rect x="40" y="90" width="420" height="330" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="48" y="106" font-size="9.5" font-weight="700" fill="#4A5766">COLLECTE</text>
<rect x="56" y="118" width="388" height="120" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="134" font-size="10.5" font-weight="700" fill="#16202B">Chaque briefing (POST /briefing)</text>
<text x="64" y="149" font-size="9" fill="#4A5766">une trace racine « briefing », identifiant = X-Request-ID</text>
<text x="64" y="162" font-size="9" fill="#4A5766">une étape par nœud : scout, rag, redacteur</text>
<text x="64" y="175" font-size="9" fill="#4A5766">une génération par tentative de fournisseur :</text>
<text x="64" y="188" font-size="9" fill="#4A5766">  durée, jetons, modèle réel, erreur du repli</text>
<text x="64" y="201" font-size="9" fill="#4A5766">un score conforme_amf (verdict du garde-fou)</text>
<rect x="56" y="252" width="388" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="268" font-size="10.5" font-weight="700" fill="#16202B">Journal de l&#x27;API</text>
<text x="64" y="283" font-size="9" fill="#4A5766">une ligne par briefing servi ou refusé, avec</text>
<text x="64" y="296" font-size="9" fill="#4A5766">l&#x27;identifiant de requête ; jamais le texte</text>
<rect x="56" y="336" width="388" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="352" font-size="10.5" font-weight="700" fill="#16202B">Fraîcheur des données</text>
<text x="64" y="367" font-size="9" fill="#4A5766">GET /donnees/fraicheur : retard en jours ouvrés</text>
<text x="64" y="380" font-size="9" fill="#4A5766">la panne la plus fréquente : la collecte d&#x27;hier</text>
<rect x="500" y="118" width="300" height="120" fill="#D8E3EA" stroke="none" stroke-width="1.2"/>
<text x="508" y="134" font-size="10.5" font-weight="700" fill="#16202B">Langfuse Cloud, région UE</text>
<text x="508" y="149" font-size="9" fill="#4A5766">reçoit les traces (palier gratuit)</text>
<text x="508" y="162" font-size="9" fill="#4A5766">calcule latence, volumes, erreurs</text>
<text x="508" y="175" font-size="9" fill="#4A5766">accès : compte du propriétaire</text>
<text x="508" y="188" font-size="9" fill="#4A5766">reçoit des chiffres de marché, jamais une position</text>
<rect x="840" y="90" width="520" height="170" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="848" y="106" font-size="9.5" font-weight="700" fill="#4A5766">RESTITUTION</text>
<rect x="856" y="118" width="488" height="64" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="864" y="134" font-size="10.5" font-weight="700" fill="#16202B">Tableau de bord « RITA C11 » (créé par l&#x27;API, 03/10)</text>
<text x="864" y="149" font-size="9" fill="#4A5766">générations par fournisseur (le repli se voit) · latence p95 de</text>
<text x="864" y="162" font-size="9" fill="#4A5766">l&#x27;appel au modèle · observations en ERROR ou WARNING</text>
<rect x="856" y="190" width="488" height="56" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="864" y="206" font-size="10.5" font-weight="700" fill="#16202B">Bandeau de fraîcheur, écran 1 · export CSV des tuiles</text>
<text x="864" y="221" font-size="9" fill="#4A5766">lisible sans la couleur ; CSV pour un lecteur d&#x27;écran ou un tableur</text>
<rect x="840" y="280" width="520" height="140" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="848" y="296" font-size="9.5" font-weight="700" fill="#4A5766">ALERTE</text>
<rect x="856" y="308" width="230" height="98" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="864" y="324" font-size="10.5" font-weight="700" fill="#16202B">2 règles Langfuse (04/10)</text>
<text x="864" y="339" font-size="9" fill="#4A5766">ERROR &gt; 0 sur 1 jour</text>
<text x="864" y="352" font-size="9" fill="#4A5766">p95 de briefing-llm</text>
<text x="864" y="365" font-size="9" fill="#4A5766">  &gt; 15 000 ms sur 1 jour</text>
<text x="864" y="378" font-size="9" fill="#4A5766">toutes deux ont sonné</text>
<rect x="1110" y="308" width="234" height="98" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="1118" y="324" font-size="10.5" font-weight="700" fill="#16202B">alerte-incident.yml</text>
<text x="1118" y="339" font-size="9" fill="#4A5766">repository_dispatch</text>
<text x="1118" y="352" font-size="9" fill="#4A5766">ouvre ou commente une</text>
<text x="1118" y="365" font-size="9" fill="#4A5766">issue « incident » par alerte</text>
<text x="1118" y="378" font-size="9" fill="#4A5766">à la main : #71 ; réel : #77</text>
<rect x="40" y="440" width="660" height="70" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="48" y="456" font-size="10.5" font-weight="700" fill="#4A5766">Bac à sable : la suite de tests ne trace jamais</text>
<text x="48" y="471" font-size="9" fill="#4A5766">tests/conftest.py coupe le traçage (INC-006) ; le banc C7 aussi (LANGFUSE_TRACING_ENABLED=false) ;</text>
<text x="48" y="484" font-size="9" fill="#4A5766">doubles de client dans tests/test_traces*.py, test_trace_chemin.py (l&#x27;ordre exact des étapes)</text>
<rect x="720" y="440" width="640" height="70" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="728" y="456" font-size="10.5" font-weight="700" fill="#9E4318">Ce qui manque</text>
<text x="728" y="471" font-size="9" fill="#4A5766">serveur de production pas encore tracé (code du 19/08) · coût OpenRouter à zéro ·</text>
<text x="728" y="484" font-size="9" fill="#4A5766">pas d&#x27;alerte de silence (deux alertes au palier gratuit) · seuils à revoir après une semaine</text>
