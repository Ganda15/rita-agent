<text x="73" y="204.5" font-size="11.5" fill="#111827">  durée, jetons, modèle réel, erreur du repli</text>
<text x="73" y="220.0" font-size="11.5" fill="#111827">un score conforme_amf (verdict du garde-fou)</text>
