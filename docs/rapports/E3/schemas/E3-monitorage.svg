<text x="40" y="544" font-size="9" fill="#4A5766">Boîtes pleines : présent et prouvé. Pointillé orange : à faire. Gris : service externe. Preuves : evidence/C11/ (alertes : preuve-alertes-2026-10-04.md).</text>
