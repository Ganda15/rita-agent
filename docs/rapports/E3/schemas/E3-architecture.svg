<defs><marker id="fl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#4A5766"/></marker></defs>
<rect width="1500" height="900" fill="#FFFFFF"/>
<rect x="40" y="18" width="1420" height="3" fill="#14607F"/>
<text x="40" y="46" font-family="Georgia,serif" font-size="19" font-weight="600" fill="#16202B">RITA : le chemin d&#x27;un briefing, et tout ce qui le regarde passer</text>
<text x="40" y="66" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#4A5766">Rapport E3, section 2 · état du code au 4 octobre 2026 · un seul utilisateur, un modèle fourni, aucune action</text>
<rect x="40" y="90" width="250" height="300" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="48" y="106" font-size="9.5" font-weight="700" fill="#4A5766">CLIENTS (C10)</text>
<rect x="56" y="118" width="218" height="72" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="134" font-size="10.5" font-weight="700" fill="#16202B">Interface web</text>
<text x="64" y="149" font-size="9" fill="#4A5766">frontend/, HTML, CSS, JS sans build</text>
<text x="64" y="162" font-size="9" fill="#4A5766">3 écrans : portefeuille, indicateurs, briefing</text>
<text x="64" y="175" font-size="9" fill="#4A5766">clé saisie, sessionStorage, 403 affiché</text>
<rect x="56" y="204" width="218" height="72" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="220" font-size="10.5" font-weight="700" fill="#16202B">Passerelle MCP</text>
<text x="64" y="235" font-size="9" fill="#4A5766">passerelle_mcp/serveur.py</text>
<text x="64" y="248" font-size="9" fill="#4A5766">3 outils en lecture seule</text>
<text x="64" y="261" font-size="9" fill="#4A5766">appelle l&#x27;API par HTTP, avec la clé</text>
<rect x="56" y="290" width="218" height="72" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="306" font-size="10.5" font-weight="700" fill="#16202B">curl, /docs (OpenAPI 3.1.0)</text>
<text x="64" y="321" font-size="9" fill="#4A5766">POST /briefing?ticker=MC.PA</text>
<text x="64" y="334" font-size="9" fill="#4A5766">le seul chemin vers le modèle</text>
<text x="64" y="347" font-size="9" fill="#4A5766">aucun texte libre : un ticker</text>
<rect x="340" y="118" width="290" height="120" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="348" y="134" font-size="10.5" font-weight="700" fill="#16202B">api/main.py : l&#x27;API (C9)</text>
<text x="348" y="149" font-size="9" fill="#4A5766">middleware : un request_id par requête (X-Request-ID)</text>
<text x="348" y="162" font-size="9" fill="#4A5766">clé X-API-Key, 16 car. min., temps constant, 403</text>
<text x="348" y="175" font-size="9" fill="#4A5766">aucune clé par défaut (INC-001, OWASP API2)</text>
<text x="348" y="188" font-size="9" fill="#4A5766">14 chemins ; /briefing est le seul qui parle au modèle</text>
<text x="348" y="201" font-size="9" fill="#4A5766">journal : servi, refusé, 502 (request_id, jamais le texte)</text>
<rect x="340" y="262" width="290" height="330" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="348" y="278" font-size="9.5" font-weight="700" fill="#4A5766">graph/workflow.py : LangGraph, 3 nœuds, arêtes fixes</text>
<rect x="356" y="290" width="258" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="306" font-size="10.5" font-weight="700" fill="#16202B">scout</text>
<text x="364" y="321" font-size="9" fill="#4A5766">lit PostgreSQL : 13 indicateurs par valeur</text>
<text x="364" y="334" font-size="9" fill="#4A5766">âge du dernier cours en jours calendaires, cotation périmée</text>
<rect x="356" y="362" width="258" height="86" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="378" font-size="10.5" font-weight="700" fill="#16202B">rag</text>
<text x="364" y="393" font-size="9" fill="#4A5766">garde-fou d&#x27;ENTRÉE : intention AMF, 7 motifs,</text>
<text x="364" y="406" font-size="9" fill="#4A5766">  100 % / 0 % (03/10), avant tout accès à la base</text>
<text x="364" y="419" font-size="9" fill="#4A5766">ChromaDB : filtre ticker puis hybride dense + BM25</text>
<text x="364" y="432" font-size="9" fill="#4A5766">refus OUT_OF_CORPUS si rien ne cite la valeur</text>
<rect x="356" y="462" width="258" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="478" font-size="10.5" font-weight="700" fill="#16202B">redacteur</text>
<text x="364" y="493" font-size="9" fill="#4A5766">agents/analyst.py : prompt (interdit AMF écrit)</text>
<text x="364" y="506" font-size="9" fill="#4A5766">src/llm.py : la cascade</text>
<rect x="356" y="532" width="258" height="48" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="364" y="548" font-size="10.5" font-weight="700" fill="#16202B">Foundry (gpt-5.4) → Anthropic → OpenRouter</text>
<text x="364" y="563" font-size="9" fill="#4A5766">une génération tracée par essai ; repli ≈ 0,3 s</text>
<rect x="340" y="612" width="290" height="70" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="348" y="628" font-size="10.5" font-weight="700" fill="#16202B">guardrails/sortie.py : garde-fou de SORTIE (C17)</text>
<text x="348" y="643" font-size="9" fill="#4A5766">9 motifs, 70 % / 0 % (03/10) ; échec fermé</text>
<text x="348" y="656" font-size="9" fill="#4A5766">texte remplacé par un refus, HTTP 200, conforme_amf=false</text>
<rect x="340" y="700" width="290" height="56" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="348" y="716" font-size="10.5" font-weight="700" fill="#16202B">Réponse JSON</text>
<text x="348" y="731" font-size="9" fill="#4A5766">ticker, prix, variation, briefing, conforme_amf,</text>
<text x="348" y="744" font-size="9" fill="#4A5766">motifs_amf ; en-tête X-Request-ID</text>
<rect x="700" y="290" width="190" height="58" fill="#D8E3EA" stroke="none" stroke-width="1.2"/>
<text x="708" y="306" font-size="10.5" font-weight="700" fill="#16202B">PostgreSQL 18 (E1)</text>
<text x="708" y="321" font-size="9" fill="#4A5766">10 tables, 1 vue, dix ans de cotations</text>
<text x="708" y="334" font-size="9" fill="#4A5766">écrit par le seul pipeline</text>
<rect x="700" y="362" width="190" height="58" fill="#D8E3EA" stroke="none" stroke-width="1.2"/>
<text x="708" y="378" font-size="10.5" font-weight="700" fill="#16202B">ChromaDB (index)</text>
<text x="708" y="393" font-size="9" fill="#4A5766">articles vectorisés, reconstruit chaque nuit</text>
<text x="708" y="406" font-size="9" fill="#4A5766">1 359 documents (27/09)</text>
<rect x="700" y="612" width="220" height="100" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="708" y="628" font-size="10.5" font-weight="700" fill="#16202B">Collecte nocturne, 19 h</text>
<text x="708" y="643" font-size="9" fill="#4A5766">pipelines/ingest.py, tâche planifiée Windows</text>
<text x="708" y="656" font-size="9" fill="#4A5766">yfinance, RSS, scraping, FRED, BCE</text>
<text x="708" y="669" font-size="9" fill="#4A5766">garde-fou d&#x27;INJECTION sur les articles :</text>
<text x="708" y="682" font-size="9" fill="#4A5766">  12 motifs, 70 % / 0 % (03/10)</text>
<text x="708" y="695" font-size="9" fill="#4A5766">40 journaux du 24/08 au 02/10</text>
<rect x="1040" y="90" width="380" height="600" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="1048" y="106" font-size="9.5" font-weight="700" fill="#4A5766">OBSERVABILITÉ (C11, C20)</text>
<rect x="1056" y="118" width="348" height="196" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="1064" y="134" font-size="10.5" font-weight="700" fill="#16202B">Langfuse Cloud, région UE (Irlande)</text>
<text x="1064" y="149" font-size="9" fill="#4A5766">une trace par briefing, identifiant = request_id :</text>
<text x="1064" y="162" font-size="9" fill="#4A5766">  briefing  (verdict AMF, note conforme_amf)</text>
<text x="1064" y="175" font-size="9" fill="#4A5766">  ├─ scout</text>
<text x="1064" y="188" font-size="9" fill="#4A5766">  ├─ rag ─ garde-fou-entree</text>
<text x="1064" y="201" font-size="9" fill="#4A5766">  ├─ redacteur ─ briefing-llm ─ llm-&lt;fournisseur&gt;</text>
<text x="1064" y="214" font-size="9" fill="#4A5766">  └─ garde-fou-sortie</text>
<text x="1064" y="227" font-size="9" fill="#4A5766">jetons, erreur du repli, niveau WARNING au refus</text>
<text x="1064" y="240" font-size="9" fill="#4A5766">première trace réelle : 02/10 18:39 ; palier gratuit</text>
<rect x="1056" y="416" width="348" height="58" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="1064" y="432" font-size="10.5" font-weight="700" fill="#16202B">GET /donnees/fraicheur + bandeau</text>
<text x="1064" y="447" font-size="9" fill="#4A5766">retard en jours ouvrés, 3 états, lisible sans couleur</text>
<text x="1064" y="460" font-size="9" fill="#4A5766">la panne la plus fréquente : la collecte d&#x27;hier</text>
<rect x="1056" y="330" width="348" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="1064" y="346" font-size="10.5" font-weight="700" fill="#16202B">Alertes (2, palier gratuit) → GitHub Actions</text>
<text x="1064" y="361" font-size="9" fill="#4A5766">erreurs de fournisseur ; p95 de l&#x27;appel au modèle</text>
<text x="1064" y="374" font-size="9" fill="#4A5766">alerte-incident.yml ouvre une issue « incident »</text>
<text x="1064" y="387" font-size="9" fill="#4A5766">réglées le 04/10, ont sonné : issue #77</text>
<rect x="1056" y="490" width="348" height="56" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="1064" y="506" font-size="10.5" font-weight="700" fill="#16202B">Tableau de bord « RITA C11 » (03/10, par l&#x27;API)</text>
<text x="1064" y="521" font-size="9" fill="#4A5766">générations par fournisseur · p95 de briefing-llm</text>
<text x="1064" y="534" font-size="9" fill="#4A5766">observations en ERROR ou WARNING</text>
<rect x="1056" y="562" width="348" height="56" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="1064" y="578" font-size="10.5" font-weight="700" fill="#9E4318">Coût par briefing</text>
<text x="1064" y="593" font-size="9" fill="#4A5766">à zéro pour OpenRouter : nom de modèle absent</text>
<text x="1064" y="606" font-size="9" fill="#4A5766">de la grille de prix Langfuse ; à corriger</text>
<rect x="700" y="728" width="220" height="70" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="708" y="744" font-size="10.5" font-weight="700" fill="#4A5766">Bac à sable</text>
<text x="708" y="759" font-size="9" fill="#4A5766">la suite de tests ne trace jamais</text>
<text x="708" y="772" font-size="9" fill="#4A5766">(conftest.py, INC-006) ; doubles de client</text>
<text x="708" y="785" font-size="9" fill="#4A5766">805 tests, 94,70 % (04/10)</text>
<rect x="700" y="814" width="220" height="56" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="708" y="830" font-size="10.5" font-weight="700" fill="#4A5766">Tests en CI à chaque poussée</text>
<text x="708" y="845" font-size="9" fill="#4A5766">test.yml : données, puis suite + couverture ≥ 90 %,</text>
<text x="708" y="858" font-size="9" fill="#4A5766">garde-fous mesurés, portes xfail strict</text>
