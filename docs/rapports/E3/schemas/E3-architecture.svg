<text x="73" y="139" font-size="14" font-weight="700" fill="#0B2A5B">Interface web</text>
<text x="73" y="158.0" font-size="11.5" fill="#111827">frontend/, HTML, CSS, JS sans build</text>
<text x="73" y="173.5" font-size="11.5" fill="#111827">3 écrans : portefeuille, indicateurs, briefing</text>
<text x="73" y="189.0" font-size="11.5" fill="#111827">clé saisie, sessionStorage, 403 affiché</text>
<rect x="56" y="210" width="242" height="82" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="56" y="210" width="7" height="82" fill="#1E293B"/>
<text x="73" y="231" font-size="14" font-weight="700" fill="#0B2A5B">Passerelle MCP</text>
<text x="73" y="250.0" font-size="11.5" fill="#111827">passerelle_mcp/serveur.py</text>
<text x="73" y="265.5" font-size="11.5" fill="#111827">3 outils en lecture seule</text>
<text x="73" y="281.0" font-size="11.5" fill="#111827">appelle l&#x27;API par HTTP, avec la clé</text>
<rect x="56" y="302" width="242" height="82" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="56" y="302" width="7" height="82" fill="#1E293B"/>
<text x="73" y="323" font-size="14" font-weight="700" fill="#0B2A5B">curl, /docs (OpenAPI 3.1.0)</text>
<text x="73" y="342.0" font-size="11.5" fill="#111827">POST /briefing?ticker=MC.PA</text>
<text x="73" y="357.5" font-size="11.5" fill="#111827">le seul chemin vers le modèle</text>
<text x="73" y="373.0" font-size="11.5" fill="#111827">aucun texte libre : un ticker</text>
<rect x="340" y="118" width="358" height="120" fill="#E3F0FD" stroke="#1565C0" stroke-width="2"/>
<rect x="340" y="118" width="7" height="120" fill="#1565C0"/>
<text x="357" y="139" font-size="14" font-weight="700" fill="#0B2A5B">api/main.py : l&#x27;API (C9)</text>
<text x="357" y="158.0" font-size="11.5" fill="#111827">middleware : un request_id par requête (X-Request-ID)</text>
<text x="357" y="173.5" font-size="11.5" fill="#111827">clé X-API-Key, 16 car. min., temps constant, 403</text>
<text x="357" y="189.0" font-size="11.5" fill="#111827">aucune clé par défaut (INC-001, OWASP API2)</text>
<text x="357" y="204.5" font-size="11.5" fill="#111827">14 chemins ; /briefing est le seul qui parle au modèle</text>
<text x="357" y="220.0" font-size="11.5" fill="#111827">journal : servi, refusé, 502 (request_id, jamais le texte)</text>
<rect x="356" y="292" width="326" height="66" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="356" y="292" width="7" height="66" fill="#1E293B"/>
<text x="373" y="313" font-size="14" font-weight="700" fill="#0B2A5B">scout</text>
<text x="373" y="332.0" font-size="11.5" fill="#111827">lit PostgreSQL : 13 indicateurs par valeur</text>
<text x="373" y="347.5" font-size="11.5" fill="#111827">âge du dernier cours en jours calendaires, cotation périmée</text>
<rect x="356" y="372" width="326" height="98" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="356" y="372" width="7" height="98" fill="#1E293B"/>
<text x="373" y="393" font-size="14" font-weight="700" fill="#0B2A5B">rag</text>
<text x="373" y="412.0" font-size="11.5" fill="#111827">garde-fou d&#x27;ENTRÉE : intention AMF, 7 motifs,</text>
<text x="373" y="427.5" font-size="11.5" fill="#111827">  100 % / 0 % (03/10), avant tout accès à la base</text>
<text x="373" y="443.0" font-size="11.5" fill="#111827">ChromaDB : filtre ticker puis hybride dense + BM25</text>
<text x="373" y="458.5" font-size="11.5" fill="#111827">refus OUT_OF_CORPUS si rien ne cite la valeur</text>
<rect x="356" y="484" width="326" height="66" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="356" y="484" width="7" height="66" fill="#1E293B"/>
<text x="373" y="505" font-size="14" font-weight="700" fill="#0B2A5B">redacteur</text>
<text x="373" y="524.0" font-size="11.5" fill="#111827">agents/analyst.py : prompt (interdit AMF écrit)</text>
<text x="373" y="539.5" font-size="11.5" fill="#111827">src/llm.py : la cascade</text>
<rect x="356" y="564" width="326" height="52" fill="#E3F0FD" stroke="#1565C0" stroke-width="2"/>
<rect x="356" y="564" width="7" height="52" fill="#1565C0"/>
<text x="373" y="585" font-size="14" font-weight="700" fill="#0B2A5B">Foundry (gpt-5.4) → Anthropic → OpenRouter</text>
<text x="373" y="604.0" font-size="11.5" fill="#111827">une génération tracée par essai ; repli ≈ 0,3 s</text>
<rect x="340" y="648" width="358" height="70" fill="#FFF1E6" stroke="#C2410C" stroke-width="2"/>
<rect x="340" y="648" width="7" height="70" fill="#C2410C"/>
<text x="357" y="669" font-size="14" font-weight="700" fill="#9A3412">guardrails/sortie.py : garde-fou de SORTIE (C17)</text>
<text x="357" y="688.0" font-size="11.5" fill="#111827">9 motifs, 70 % / 0 % (03/10) ; échec fermé</text>
<text x="357" y="703.5" font-size="11.5" fill="#111827">texte remplacé par un refus, HTTP 200, conforme_amf=false</text>
<rect x="340" y="736" width="358" height="66" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="340" y="736" width="7" height="66" fill="#1E293B"/>
<text x="357" y="757" font-size="14" font-weight="700" fill="#0B2A5B">Réponse JSON</text>
<text x="357" y="776.0" font-size="11.5" fill="#111827">ticker, prix, variation, briefing, conforme_amf,</text>
<text x="357" y="791.5" font-size="11.5" fill="#111827">motifs_amf ; en-tête X-Request-ID</text>
