<text x="747" y="332.0" font-size="11.5" fill="#111827">10 tables, 1 vue, dix ans de cotations</text>
<text x="747" y="347.5" font-size="11.5" fill="#111827">écrit par le seul pipeline</text>
<rect x="730" y="372" width="240" height="66" fill="#F1EAFE" stroke="#6D28D9" stroke-width="2"/>
<rect x="730" y="372" width="7" height="66" fill="#6D28D9"/>
