<text x="40" y="54" font-size="30" font-weight="700" fill="#0B2A5B">RITA : le chemin d&#x27;un briefing, et tout ce qui le regarde passer</text>
<text x="40" y="80" font-size="15" fill="#1F2937">Rapport E3, section 2 · état du code au 4 octobre 2026 · un seul utilisateur, un modèle fourni, aucune action</text>
