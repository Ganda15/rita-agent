<text x="1063" y="456.0" font-size="11.5" fill="#111827">retard en jours ouvrés, 3 états, lisible sans couleur</text>
<text x="1063" y="471.5" font-size="11.5" fill="#111827">la panne la plus fréquente : la collecte d&#x27;hier</text>
