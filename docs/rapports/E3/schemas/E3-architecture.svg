<text x="747" y="412.0" font-size="11.5" fill="#111827">articles vectorisés, reconstruit chaque nuit</text>
<text x="747" y="427.5" font-size="11.5" fill="#111827">1 359 documents (27/09)</text>
<rect x="730" y="648" width="260" height="114" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="730" y="648" width="7" height="114" fill="#1E293B"/>
<text x="747" y="669" font-size="14" font-weight="700" fill="#0B2A5B">Collecte nocturne, 19 h</text>
<text x="747" y="688.0" font-size="11.5" fill="#111827">pipelines/ingest.py, tâche planifiée Windows</text>
<text x="747" y="703.5" font-size="11.5" fill="#111827">yfinance, RSS, scraping, FRED, BCE</text>
<text x="747" y="719.0" font-size="11.5" fill="#111827">garde-fou d&#x27;INJECTION sur les articles :</text>
<text x="747" y="734.5" font-size="11.5" fill="#111827">  12 motifs, 70 % / 0 % (03/10)</text>
<text x="747" y="750.0" font-size="11.5" fill="#111827">40 journaux du 24/08 au 02/10</text>
