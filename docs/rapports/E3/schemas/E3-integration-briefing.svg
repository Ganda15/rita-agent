<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Segoe UI,Calibri,Arial,sans-serif">
<defs><marker id="fl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#4A5766"/></marker></defs>
<rect width="1400" height="560" fill="#FFFFFF"/>
<rect x="40" y="18" width="1320" height="3" fill="#14607F"/>
<text x="40" y="46" font-family="Georgia,serif" font-size="19" font-weight="600" fill="#16202B">RITA : une demande de briefing, de l&#x27;écran au modèle et retour</text>
<text x="40" y="66" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#4A5766">Rapport E3, section 4 · écran 3 (frontend/briefing.html, briefing.js) · état au 4 octobre 2026</text>
<rect x="40" y="100" width="200" height="120" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="48" y="116" font-size="10.5" font-weight="700" fill="#16202B">1. L&#x27;utilisateur</text>
<text x="48" y="131" font-size="9" fill="#4A5766">saisit la clé (champ masqué)</text>
<text x="48" y="144" font-size="9" fill="#4A5766">choisit un code dans la liste</text>
<text x="48" y="157" font-size="9" fill="#4A5766">  (GET /donnees/valeurs, facultatif)</text>
<text x="48" y="170" font-size="9" fill="#4A5766">envoie : bouton ou touche Entrée</text>
<rect x="280" y="100" width="250" height="120" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="288" y="116" font-size="10.5" font-weight="700" fill="#16202B">2. L&#x27;écran envoie</text>
<text x="288" y="131" font-size="9" fill="#4A5766">POST /briefing?ticker=MC.PA</text>
<text x="288" y="144" font-size="9" fill="#4A5766">en-tête X-API-Key (sessionStorage)</text>
<text x="288" y="157" font-size="9" fill="#4A5766">annonce l&#x27;attente : 5 à 15 s</text>
<text x="288" y="170" font-size="9" fill="#4A5766">  (zone de statut, aria-live)</text>
<rect x="570" y="100" width="250" height="120" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="578" y="116" font-size="10.5" font-weight="700" fill="#16202B">3. L&#x27;API vérifie</text>
<text x="578" y="131" font-size="9" fill="#4A5766">clé : 16 car. min., temps constant</text>
<text x="578" y="144" font-size="9" fill="#4A5766">identifiant de requête X-Request-ID</text>
<text x="578" y="157" font-size="9" fill="#4A5766">puis le graphe : scout, rag, redacteur</text>
<rect x="860" y="100" width="250" height="120" fill="#ECF3F7" stroke="#14607F" stroke-width="1.2"/>
<text x="868" y="116" font-size="10.5" font-weight="700" fill="#16202B">4. Le modèle écrit</text>
<text x="868" y="131" font-size="9" fill="#4A5766">cascade Foundry → Anthropic → OpenRouter</text>
<text x="868" y="144" font-size="9" fill="#4A5766">puis garde-fou de SORTIE</text>
<text x="868" y="157" font-size="9" fill="#4A5766">  (texte retenu si recommandation)</text>
<rect x="1150" y="100" width="210" height="120" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="1158" y="116" font-size="10.5" font-weight="700" fill="#16202B">5. L&#x27;écran affiche</text>
<text x="1158" y="131" font-size="9" fill="#4A5766">le verdict EN MOTS</text>
<text x="1158" y="144" font-size="9" fill="#4A5766">le texte par textContent</text>
<text x="1158" y="157" font-size="9" fill="#4A5766">la référence de requête</text>
<text x="1158" y="170" font-size="9" fill="#4A5766">focus posé sur le résultat</text>
<rect x="40" y="260" width="1320" height="190" fill="none" stroke="#D5DCE4" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="48" y="276" font-size="9.5" font-weight="700" fill="#4A5766">LES RÉPONSES QUI NE SONT PAS UN BRIEFING, ET CE QUE L&#x27;ÉCRAN EN FAIT</text>
<rect x="56" y="290" width="300" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="64" y="306" font-size="10.5" font-weight="700" fill="#16202B">403 : clé refusée</text>
<text x="64" y="321" font-size="9" fill="#4A5766">la clé est oubliée (sessionStorage)</text>
<text x="64" y="334" font-size="9" fill="#4A5766">retour à la saisie, message en clair</text>
<rect x="376" y="290" width="300" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="384" y="306" font-size="10.5" font-weight="700" fill="#16202B">502 : valeur absente de la base</text>
<text x="384" y="321" font-size="9" fill="#4A5766">« Valeur introuvable : … n&#x27;est pas</text>
<text x="384" y="334" font-size="9" fill="#4A5766">dans l&#x27;univers suivi »</text>
<rect x="696" y="290" width="300" height="70" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="704" y="306" font-size="10.5" font-weight="700" fill="#9E4318">500 : aucun fournisseur ne répond</text>
<text x="704" y="321" font-size="9" fill="#4A5766">mesuré le 03/10 : « Erreur 500 » générique,</text>
<text x="704" y="334" font-size="9" fill="#4A5766">sans fuite ; message dédié prévu (#75)</text>
<rect x="1016" y="290" width="328" height="70" fill="#FFFFFF" stroke="#14607F" stroke-width="1.2"/>
<text x="1024" y="306" font-size="10.5" font-weight="700" fill="#16202B">Aucune réponse du serveur</text>
<text x="1024" y="321" font-size="9" fill="#4A5766">pas de code HTTP à lire : try/catch,</text>
<text x="1024" y="334" font-size="9" fill="#4A5766">« Le serveur ne répond pas »</text>
<rect x="56" y="372" width="620" height="62" fill="#FBF1EC" stroke="#9E4318" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="64" y="388" font-size="10.5" font-weight="700" fill="#9E4318">Défaut connu : la clé est mémorisée avant d&#x27;avoir servi (#73)</text>
<text x="64" y="403" font-size="9" fill="#4A5766">les écrans 1 et 2 attendent un appel réussi ; l&#x27;écran 3 non. Correction après le gel du 15/10, test d&#x27;abord.</text>
<rect x="696" y="372" width="648" height="62" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="704" y="388" font-size="10.5" font-weight="700" fill="#4A5766">Le deuxième client : la passerelle MCP</text>
<text x="704" y="403" font-size="9" fill="#4A5766">mêmes routes, même clé ; trois outils en lecture seule ; aucun outil ne donne accès à /briefing</text>
<rect x="40" y="470" width="1320" height="50" fill="#F7F9FB" stroke="#D5DCE4" stroke-width="1.2"/>
<text x="48" y="486" font-size="10.5" font-weight="700" fill="#4A5766">Preuves</text>
<text x="48" y="501" font-size="9" fill="#4A5766">tests/test_frontend.py (72, statiques) · tests/test_smoke_ui.py (7, vrai navigateur, /briefing intercepté) · tests/test_health.py, test_api_donnees.py (l&#x27;API) · evidence/C10/</text>
<line x1="240" y1="160.0" x2="280" y2="160.0" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)"/>
<line x1="530" y1="160.0" x2="570" y2="160.0" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)"/>
<line x1="820" y1="160.0" x2="860" y2="160.0" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)"/>
<line x1="1110" y1="160.0" x2="1150" y2="160.0" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)"/>
<line x1="620.0" y1="220" x2="296.0" y2="290" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)" stroke-dasharray="5,4"/>
<text x="458.0" y="250.0" font-size="8.5" fill="#4A5766" text-anchor="middle">sans clé</text>
<line x1="695.0" y1="220" x2="556.0" y2="290" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)" stroke-dasharray="5,4"/>
<line x1="935.0" y1="220" x2="876.0" y2="290" stroke="#4A5766" stroke-width="1.3" marker-end="url(#fl)" stroke-dasharray="5,4"/>
<text x="40" y="544" font-size="9" fill="#4A5766">Boîtes pleines : comportement présent et testé. Pointillé orange : écart connu, corrigé après le gel. Flèches pointillées : réponses d&#x27;erreur.</text>
</svg>