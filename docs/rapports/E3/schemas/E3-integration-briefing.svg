<text x="57" y="125" font-size="14" font-weight="700" fill="#0B2A5B">1. L&#x27;utilisateur</text>
<text x="57" y="144.0" font-size="11.5" fill="#111827">saisit la clé (champ masqué)</text>
<text x="57" y="159.5" font-size="11.5" fill="#111827">choisit un code dans la liste,</text>
<text x="57" y="175.0" font-size="11.5" fill="#111827">remplie par GET /donnees/valeurs</text>
<text x="57" y="190.5" font-size="11.5" fill="#111827">envoie : bouton ou touche Entrée</text>
<rect x="302" y="104" width="256" height="128" fill="#E3F0FD" stroke="#1565C0" stroke-width="2"/>
<rect x="302" y="104" width="7" height="128" fill="#1565C0"/>
<text x="319" y="125" font-size="14" font-weight="700" fill="#0B2A5B">2. L&#x27;écran envoie</text>
<text x="319" y="144.0" font-size="11.5" fill="#111827">POST /briefing?ticker=MC.PA</text>
<text x="319" y="159.5" font-size="11.5" fill="#111827">en-tête X-API-Key</text>
<text x="319" y="175.0" font-size="11.5" fill="#111827">annonce l&#x27;attente : 5 à 15 s</text>
<text x="319" y="190.5" font-size="11.5" fill="#111827">  (zone de statut, aria-live)</text>
<rect x="584" y="104" width="262" height="128" fill="#E3F0FD" stroke="#1565C0" stroke-width="2"/>
<rect x="584" y="104" width="7" height="128" fill="#1565C0"/>
<text x="601" y="125" font-size="14" font-weight="700" fill="#0B2A5B">3. L&#x27;API vérifie</text>
<text x="601" y="144.0" font-size="11.5" fill="#111827">clé : 16 car. min., temps constant</text>
<text x="601" y="159.5" font-size="11.5" fill="#111827">identifiant X-Request-ID</text>
<text x="601" y="175.0" font-size="11.5" fill="#111827">puis le graphe :</text>
<text x="601" y="190.5" font-size="11.5" fill="#111827">  scout, rag, redacteur</text>
<rect x="872" y="104" width="262" height="128" fill="#E3F0FD" stroke="#1565C0" stroke-width="2"/>
<rect x="872" y="104" width="7" height="128" fill="#1565C0"/>
<text x="889" y="125" font-size="14" font-weight="700" fill="#0B2A5B">4. Le modèle écrit</text>
<text x="889" y="144.0" font-size="11.5" fill="#111827">cascade de fournisseurs :</text>
<text x="889" y="159.5" font-size="11.5" fill="#111827">  Foundry → Anthropic → OpenRouter</text>
<text x="889" y="175.0" font-size="11.5" fill="#111827">puis garde-fou de SORTIE</text>
<text x="889" y="190.5" font-size="11.5" fill="#111827">  (texte retenu si recommandation)</text>
<rect x="1160" y="104" width="200" height="128" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="1160" y="104" width="7" height="128" fill="#1E293B"/>
<text x="1177" y="125" font-size="14" font-weight="700" fill="#0B2A5B">5. L&#x27;écran affiche</text>
<text x="1177" y="144.0" font-size="11.5" fill="#111827">le verdict EN MOTS</text>
<text x="1177" y="159.5" font-size="11.5" fill="#111827">le texte (textContent)</text>
<text x="1177" y="175.0" font-size="11.5" fill="#111827">la référence de requête</text>
<text x="1177" y="190.5" font-size="11.5" fill="#111827">focus sur le résultat</text>
<rect x="56" y="340" width="307" height="88" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
