<text x="40" y="54" font-size="30" font-weight="700" fill="#0B2A5B">RITA : une demande de briefing, de l&#x27;écran au modèle et retour</text>
<text x="40" y="80" font-size="15" fill="#1F2937">Rapport E3, section 4 · écran 3 (frontend/briefing.html, briefing.js) · état au 4 octobre 2026</text>
<g transform="translate(0,16)">
