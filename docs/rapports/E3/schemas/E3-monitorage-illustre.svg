l="#0d3c78" text-anchor="start">Chaque briefing, chaque question</text><text x="41.0" y="193.8" font-size="17.6" font-weight="400" fill="#1e293b" text-anchor="start">une trace, identifiant = X-Request-ID ;</text><text x="41.0" y="216.9" font-size="17.6" font-weight="400" fill="#1e293b" text-anchor="start">une étape par nœud et par garde-fou ;</text><text x="41.0" y="240.0" font-size="17.6" font-weight="400" fill="#1e293b" text-anchor="start">une génération par fournisseur essayé :</text><text x="41.0" y="263.1" font-size="17.6" font-weight="400" fill="#1e293b" text-anchor="start">durée, jetons, modèle ; aucun texte</text><rect x="24" y="295" width="422" height="92" rx="12" fill="#ffffff" stroke="#1f2a44" stroke-width="2.2"/><g transform="translate(405.0,302) scale(0.688)"><rect x="7" y="3" width="34" height="42" rx="3" fill="#fff" stroke="#1f2a44" stroke-width="3.5"/><path d="M13,13 H35" stroke="#1f2a44" stroke-width="3"/><path d="M13,21 H35" stroke="#1f2a44" stroke-width="3"/><path d="M13,29 H35" stroke="#1f2a44" stroke-width="3"/><path d="M13,37 H35" stroke="#1f2a44" stroke-width="3"/></g><text x="38.0" y="325.7" font-size="18.7" font-weight="700" fill="#0f1f3d" text-anchor="start">Journal de l&#x27;API</text><text x="38.0" y="352.8" font-size="17.6" font-weight="400" fill="#1e293b" text-anchor="start">une ligne par briefing ou question,</text><text x="38.0" y="375.9" font-size="17.6" font-weight="400" fill="#1e293b" text-anchor="start">avec l&#x27;identifiant ; jamais le texte</text><rect x="24" y="407" width="422" height="92" rx="12" fill="#ffffff" stroke="#1f2a44" stroke-width="2.2"/><g transform="translate(405.0,414) scale(0.688)"><rect x="3" y="10" width="42" height="28" rx="4" fill="#fff" stroke="#1f2a44" stroke-width="3.5"/><rect x="9" y="16" width="8" height="16" rx="1" fill="#1f2a44"/><rect x="20" y="16" width="8" height="16" rx="1" fill="#1f2a44"/><rect x="31" y="16" width="8" height="16" rx="1" fill="#1f2a44"/></g><text x="38.0" y="437.7" font-size="18.