<text x="973" y="300" font-size="15.5" fill="#111827">11/10 : note S41 sur Discord,</text>
<text x="973" y="320" font-size="15.5" fill="#111827">canal #veille ; capture versée ;</text>
<text x="973" y="340" font-size="15.5" fill="#111827">aucune réponse au 31/10</text>
<rect x="956" y="374" width="388" height="100" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
<rect x="956" y="374" width="7" height="100" fill="#475569"/>
<text x="973" y="398" font-size="17.5" font-weight="700" fill="#0B2A5B">La leçon, confirmée en S41</text>
<text x="973" y="420" font-size="15.5" fill="#111827">un détecteur réussit le test sur</text>
<text x="973" y="440" font-size="15.5" fill="#111827">lequel il a été réglé, et rate</text>
<text x="973" y="460" font-size="15.5" fill="#111827">presque tout sur un autre jeu</text>
