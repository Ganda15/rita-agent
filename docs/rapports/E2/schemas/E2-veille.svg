<text x="73" y="398" font-size="17.5" font-weight="700" fill="#0B2A5B">Le relevé, chaque lundi</text>
<text x="73" y="420" font-size="15.5" fill="#111827">9 h à 10 h : flux RSS et Atom, pages ;</text>
<text x="73" y="440" font-size="15.5" fill="#111827">les candidats de la semaine dans</text>
<text x="73" y="460" font-size="15.5" fill="#111827">docs/veille/_candidats-2026-Sxx.md</text>
