<text x="973" y="158" font-size="17.5" font-weight="700" fill="#0B2A5B">Ce que ça change dans RITA</text>
<text x="973" y="180" font-size="15.5" fill="#111827">S34 (17/08) : 3 cas adverses,</text>
<text x="973" y="200" font-size="15.5" fill="#111827">le filtre d&#x27;injection bloque 7 sur 10 ;</text>
<text x="973" y="220" font-size="15.5" fill="#111827">seuil 85 %, test en échec attendu</text>
<rect x="956" y="254" width="388" height="100" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
<rect x="956" y="254" width="7" height="100" fill="#1E293B"/>
