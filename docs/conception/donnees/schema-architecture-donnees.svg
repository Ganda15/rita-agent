<text x="50" y="62" font-size="31" font-weight="700" fill="#172D42">RITA · Architecture des données</text>
<text x="50" y="99" font-size="17" fill="#53677B">Conception du 07/09/2026 · Existant lu sur develop ; compléments proposés · Aucun changement appliqué</text>
<text x="60" y="156" font-size="16" font-weight="700" fill="#146C63">PRÉPARER LES DONNÉES</text>
<text x="850" y="156" font-size="16" font-weight="700" fill="#214C72">CONSULTER ET RÉDIGER</text>
<rect x="60" y="185" width="610" height="135" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="82" y="214" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="82" y="245" font-size="21" font-weight="700" fill="#172D42">Sources de RITA</text><text x="82" y="270" font-size="16" font-weight="400" fill="#53677B">Marché et taux · actualités RSS · archive Parquet</text><text x="82" y="292" font-size="16" font-weight="400" fill="#53677B">CSV personnel local / jeu fictif séparé</text>
<rect x="60" y="365" width="610" height="135" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="82" y="394" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="82" y="425" font-size="21" font-weight="700" fill="#172D42">Collecte et qualité</text><text x="82" y="450" font-size="16" font-weight="400" fill="#53677B">Formats · dates · devises · doublons · quarantaine</text><text x="82" y="472" font-size="16" font-weight="400" fill="#53677B">Comptages réels et provenance à tracer</text>
<rect x="60" y="550" width="610" height="150" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="82" y="579" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="82" y="610" font-size="21" font-weight="700" fill="#172D42">PostgreSQL · source de référence</text><text x="82" y="635" font-size="16" font-weight="400" fill="#53677B">Valeurs, cotations, taux, articles, positions, audit</text><text x="82" y="657" font-size="16" font-weight="400" fill="#53677B">Données personnelles : périmètre local propriétaire</text><text x="82" y="679" font-size="16" font-weight="400" fill="#53677B">Lecture métier ; écritures de collecte séparées</text>
<rect x="60" y="755" width="610" height="155" rx="14" fill="white" stroke="#146C63" stroke-width="2"/><text x="82" y="784" font-size="11" font-weight="700" fill="#146C63">OBSERVÉ</text><text x="82" y="815" font-size="21" font-weight="700" fill="#172D42">Indexation des articles</text><text x="82" y="840" font-size="16" font-weight="400" fill="#53677B">Titre + résumé · mentions de tickers · éditeur et date</text><text x="82" y="862" font-size="16" font-weight="400" fill="#53677B">Un article court = un document ; aucun portefeuille</text><text x="82" y="884" font-size="16" font-weight="400" fill="#53677B">Proposé : versions, retraits et réconciliation</text>
<rect x="60" y="970" width="610" height="150" rx="14" fill="white" stroke="#146C63" stroke-width="2"/><text x="82" y="999" font-size="11" font-weight="700" fill="#146C63">OBSERVÉ</text><text x="82" y="1030" font-size="21" font-weight="700" fill="#172D42">Index documentaire dérivé</text><text x="82" y="1055" font-size="16" font-weight="400" fill="#53677B">Chroma local · embeddings documentés : 384 dim.</text><text x="82" y="1077" font-size="16" font-weight="400" fill="#53677B">BM25 reconstruit à la recherche</text><text x="82" y="1099" font-size="16" font-weight="400" fill="#53677B">L’index hérite des restrictions de ses sources</text>
<rect x="850" y="185" width="690" height="135" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="872" y="214" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="872" y="245" font-size="21" font-weight="700" fill="#172D42">Client compatible MCP</text><text x="872" y="270" font-size="16" font-weight="400" fill="#53677B">Processus local de confiance ou client de démo</text><text x="872" y="292" font-size="16" font-weight="400" fill="#53677B">Local ne signifie pas que le modèle est local</text>
<rect x="850" y="365" width="690" height="145" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="872" y="394" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="872" y="425" font-size="21" font-weight="700" fill="#172D42">Passerelle MCP RITA · stdio</text><text x="872" y="450" font-size="16" font-weight="400" fill="#53677B">rita_fraicheur · rita_indicateurs · rita_portefeuille</text><text x="872" y="472" font-size="16" font-weight="400" fill="#53677B">Appels HTTP à l’API avec une clé d’environnement</text><text x="872" y="494" font-size="16" font-weight="400" fill="#53677B">Proposé : search_articles, droits par périmètre, audit</text>
<rect x="850" y="550" width="690" height="150" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="872" y="579" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="872" y="610" font-size="21" font-weight="700" fill="#172D42">API REST de RITA</text><text x="872" y="635" font-size="16" font-weight="400" fill="#53677B">/donnees/* : données et calculs déterministes</text><text x="872" y="657" font-size="16" font-weight="400" fill="#53677B">/briefing : service de rédaction IA</text><text x="872" y="679" font-size="16" font-weight="400" fill="#53677B">Proposé : route de recherche RAG et restrictions fines</text>
<rect x="850" y="755" width="690" height="155" rx="14" fill="white" stroke="#146C63" stroke-width="2"/><text x="872" y="784" font-size="11" font-weight="700" fill="#146C63">OBSERVÉ</text><text x="872" y="815" font-size="21" font-weight="700" fill="#172D42">Recherche RAG hybride</text><text x="872" y="840" font-size="16" font-weight="400" fill="#53677B">Dense + BM25 → fusion RRF → pertinence / refus</text><text x="872" y="862" font-size="16" font-weight="400" fill="#53677B">Filtre ticker existant ; dense filtré après classement</text><text x="872" y="884" font-size="16" font-weight="400" fill="#53677B">Proposé : droits avant recherche et retraits contrôlés</text>
<rect x="850" y="970" width="690" height="150" rx="14" fill="white" stroke="#214C72" stroke-width="2"/><text x="872" y="999" font-size="11" font-weight="700" fill="#214C72">OBSERVÉ</text><text x="872" y="1030" font-size="21" font-weight="700" fill="#172D42">Contexte sélectionné → modèle → briefing</text><text x="872" y="1055" font-size="16" font-weight="400" fill="#53677B">Indicateurs et extraits avec source, date et lien</text><text x="872" y="1077" font-size="16" font-weight="400" fill="#53677B">Aucune recommandation d’achat / vente : règle RITA</text><text x="872" y="1099" font-size="16" font-weight="400" fill="#53677B">Proposé : contrôle d’intention avant recherche</text>
