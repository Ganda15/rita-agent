<path d="M1195 910 V970" fill="none" stroke="#214C72" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1210" y="945" font-size="13" font-weight="400" fill="#53677B">extraits citables</text>
<rect x="60" y="1175" width="1480" height="155" rx="16" fill="#E5EDF3"/>
<text x="85" y="1208" font-size="15" font-weight="700" fill="#214C72">RÈGLES DE LA CIBLE</text>
<text x="85" y="1240" font-size="17" font-weight="400" fill="#172D42">Tout accès non prévu est refusé. La lecture seule est imposée par les permissions, pas par une annotation.</text><text x="85" y="1269" font-size="17" font-weight="400" fill="#172D42">Retirer un article implique de retirer ses dérivations. Les nombres gardent leur date, leur devise et leur source.</text><text x="85" y="1298" font-size="17" font-weight="400" fill="#172D42">Text-to-SQL non retenu : les outils lisent des calculs prédéfinis. Les réponses reviennent par le même chemin.</text>
</g></svg>