<text x="1120" y="697" font-size="14" font-weight="700" fill="#214C72">VUE DE VALORISATION</text>
<text x="1120" y="730" font-size="15" font-weight="400" fill="#172D42">v_portefeuille_valorise</text><text x="1120" y="758" font-size="15" font-weight="400" fill="#172D42">Position + valeur + dernier cours + taux</text><text x="1120" y="786" font-size="15" font-weight="400" fill="#172D42">Une vue n’est pas une table supplémentaire.</text><text x="1120" y="814" font-size="15" font-weight="400" fill="#172D42">À sécuriser : devise sans taux ≠ taux 1.</text>
<text x="65" y="900" font-size="18" font-weight="700" fill="#172D42">ARTICLE et MEMORY_AUDIT : entités indépendantes dans le schéma physique lu.</text>
<rect x="60" y="1170" width="1480" height="135" rx="14" fill="#FFF4DB" stroke="#B78B36"/>
<text x="82" y="1203" font-size="15" font-weight="700" fill="#996A10">LIEN DOCUMENTAIRE DÉRIVÉ</text>
<text x="82" y="1236" font-size="17" font-weight="400" fill="#172D42">Un article peut mentionner plusieurs valeurs ; une valeur peut être mentionnée par plusieurs articles.</text><text x="82" y="1265" font-size="17" font-weight="400" fill="#172D42">Ce lien existe dans les métadonnées de Chroma (tickers détectés), sans table de liaison SQL dans le socle lu.</text>
