# =============================================================================
# CHAÎNE DE LIVRAISON CONTINUE — compétence C13
#
# C13 : « Créer une chaîne de livraison continue d'un modèle d'intelligence
#         artificielle afin d'automatiser les étapes de livraison. »
#
# Ce fichier est le complément de `test.yml` :
#
#   test.yml       INTÉGRATION continue  — les tests tournent à chaque envoi
#   livraison.yml  LIVRAISON continue    — l'image se construit et se publie
#
# ⚠️ LE CHOIX QUI STRUCTURE TOUT : on ne publie **que sur un tag**.
#
#    Un tag = un livrable. C'est déjà la discipline du projet : le formateur
#    reçoit `.../tree/livrable-E1-v1`, pas la branche par défaut. La même
#    règle vaut pour l'image : `ghcr.io/ganda15/rita-api:livrable-E1-v1`
#    montre le code **exactement tel qu'il était le jour de l'envoi**.
#
#    Publier à chaque envoi sur `develop` produirait des dizaines d'images
#    dont aucune ne correspondrait à quoi que ce soit d'identifiable.
# =============================================================================

name: Livraison

on:
  push:
    # Sur ces branches : on CONSTRUIT seulement, pour détecter tout de suite
    # qu'un Dockerfile ne compile plus. Aucune publication.
    branches: [main, develop]
    # Sur un tag de livrable : on construit ET on publie.
    tags: ["livrable-*"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRE: ghcr.io
  IMAGE: ${{ github.repository_owner }}/rita-api

jobs:

  # --- Le lint (sprint 2, tâche 2) -------------------------------------------
  # Premier maillon de la chaîne du brief : lint, tests, construction, déploiement. Il lit le code sans
  # l'exécuter et ne cherche que les vraies erreurs (règles dans `ruff.toml`). Version fixée, la même que
  # dans `requirements.txt` (contrôlé par `tests/test_lint_config.py`). Check requis sur `main` (tâche 10).
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer ruff (version fixée)
        run: pip install "ruff==0.15.17"
      - name: Lint
        run: ruff check .

  # --- Les secrets (sprint 2, tâche 3) ----------------------------------------
  # Critère 5 de la grille : aucun secret dans le dépôt, y compris dans l'HISTORIQUE (une clé effacée aujourd'hui
  # reste lisible dans les anciens commits). gitleaks à une version fixée, ses règles par défaut, valeurs masquées.
  # Exceptions : les cinq fausses clés de test (`.gitleaks.toml`) ; les secrets révoqués de l'incident INC-008
  # (`.gitleaksignore`). Puis le contrôle des déclarations ARG et ENV du Dockerfile. Check requis (tâche 10).
  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique, toutes les branches et tous les tags : c'est ce que gitleaks doit lire.
          fetch-depth: 0
      - name: Chercher des secrets dans tout l'historique (gitleaks v8.30.1)
        # `safe.directory` : le dépôt monté appartient à l'utilisateur du runner, pas à celui du conteneur ; sans
        # cette ligne, Git refuserait de le lire (« dubious ownership »).
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --log-opts="--branches --remotes --tags" \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --exit-code 1
      - name: Aucune déclaration ARG ou ENV sensible dans le Dockerfile
        run: python3 scripts/verifier_dockerfile.py Dockerfile

  construire-et-publier:
    runs-on: ubuntu-24.04
    # Les tests et la construction ne partent qu'après un lint ET un contrôle des secrets verts : l'ordre du brief,
    # et aucune image construite ni publiée si gitleaks trouve une clé.
    needs: [lint, secrets]

    permissions:
      contents: read
      # Nécessaire pour pousser sur le registre de conteneurs de GitHub.
      # Aucun secret à gérer : le jeton est fourni par la plateforme et expire
      # à la fin du job. Un mot de passe de registre stocké en secret serait
      # une clé de plus à faire tourner — et à oublier de faire tourner.
      packages: write

    steps:
      - uses: actions/checkout@v7

      # --- La porte de qualité ------------------------------------------
      # ⚠️ Les tests tournent AVANT la construction, dans ce job, et pas
      # seulement dans test.yml. Deux workflows séparés peuvent passer l'un
      # sans l'autre : livrer une image dont les tests n'ont pas été rejoués
      # sur CE commit, c'est livrer sans filet.
      #
      # `requirements.txt` (et non `-api`) : les tests ont besoin de pytest
      # et du reste de l'outillage, que l'image n'embarque pas.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dépendances de test
        run: pip install -r requirements.txt

      - name: Tests — porte de livraison
        env:
          # L'API refuse de démarrer sans clé (OWASP API2). Celle-ci n'est
          # utilisée que par la suite de tests, et n'entre jamais dans l'image.
          RITA_API_KEY: cle-de-test-integration-continue-32c
        # Definition of Done du livrable (19/09/2026) : tests + couverture, portes
        # d'evaluation, liens internes, et sur un tag : le tag cite dans ETAT.md et
        # CHANGELOG.md. Avant : `pytest -q` seul — un tag sur un commit non couvert
        # aurait publie quand meme. Le verdict est genere, jamais ecrit.
        run: python scripts/verifier_livrable.py --ci

      # --- La construction ----------------------------------------------
      # Issue #22 (26/09/2026) : l'image n'est JAMAIS publiée ici. Elle est chargée
      # dans Docker (`load: true`) pour être vérifiée, puis c'est CETTE image, et pas
      # une autre construction, qui est publiée à la fin, seulement si tout est vert.
      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Calculer les étiquettes de l'image
        id: etiquettes
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRE }}/${{ env.IMAGE }}
          # `type=ref,event=tag` produit `:livrable-E1-v1`
          # `type=sha` produit `:sha-83b462c` — traçable au commit près
          tags: |
            type=ref,event=tag
            type=sha,format=short

      # Sprint 2 : la date de construction, que l'image annonce dans `/health` avec son commit.
      - name: Date de construction
        id: date
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Construire l'image (sans publier)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.etiquettes.outputs.tags }}
            rita-api:verification
          labels: ${{ steps.etiquettes.outputs.labels }}
          # Lus par les `ARG GIT_SHA` et `ARG CONSTRUIT_LE` du Dockerfile, puis servis par `/health`.
          build-args: |
            GIT_SHA=${{ github.sha }}
            CONSTRUIT_LE=${{ steps.date.outputs.iso }}
          # Le cache évite de retélécharger et recompiler les dépendances à
          # chaque exécution : quelques minutes, et autant d'énergie, en moins.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- La vérification ------------------------------------------------
      # ⚠️ Une image qui se construit n'est pas une image qui démarre. On lance
      # l'image construite juste au-dessus, sans la reconstruire : c'est elle,
      # et elle seule, qui sera publiée.
      - name: Vérifier que l'image démarre et répond
        run: |
          docker run -d --name verification -p 8000:8000 \
            -e RITA_API_KEY=cle-de-verification-au-demarrage-32c \
            rita-api:verification
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "L'API repond au bout de ${i}s"
              curl -s http://localhost:8000/health
              echo
              break
            fi
            if [ "$i" = "20" ]; then
              echo "::error::L'API n'a pas repondu en 20 secondes"
              docker logs verification
              exit 1
            fi
            sleep 1
          done

      - name: Vérifier la version annoncée par /health
        # Les tests Python prouvent que `/health` lit les variables ; ce contrôle prouve qu'elles sont bien
        # arrivées dans l'image construite (build-args, puis ARG et ENV du Dockerfile). Les deux champs sont
        # comparés aux valeurs de construction, en lisant le JSON (pas une recherche de texte).
        env:
          COMMIT_ATTENDU: ${{ github.sha }}
          DATE_ATTENDUE: ${{ steps.date.outputs.iso }}
        run: |
          curl -s http://localhost:8000/health > health.json
          python3 - <<'PY'
          import json, os, sys
          corps = json.load(open("health.json", encoding="utf-8"))
          attendus = {"commit": os.environ["COMMIT_ATTENDU"], "construit_le": os.environ["DATE_ATTENDUE"]}
          ecarts = [(champ, corps.get(champ), valeur) for champ, valeur in attendus.items()
                    if corps.get(champ) != valeur]
          for champ, lu, valeur in ecarts:
              print(f"::error::/health annonce {champ}={lu!r}, attendu {valeur!r}")
          if not ecarts:
              print(f"/health annonce le commit {corps['commit']} construit le {corps['construit_le']}")
          sys.exit(1 if ecarts else 0)
          PY

      - name: Vérifier que l'accès est bien restreint
        # Une image qui démarre mais qui laisse entrer sans clé serait pire
        # qu'une image cassée : elle passerait inaperçue.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/donnees/valeurs)
          echo "sans cle -> HTTP $code"
          if [ "$code" != "403" ]; then
            echo "::error::L'API repond $code sans cle d'API, 403 attendu"
            exit 1
          fi

      - name: Vérifier que l'image ne contient pas de fichier .env
        # Ce contrôle ne vérifie que ce chemin-là, `/app/.env` ; à la construction, `.dockerignore` exclut déjà
        # `.env` et `.env.*`. La preuve le dit telle quelle. Le conteneur doit RÉUSSIR à prouver l'absence
        # (`test ! -e`) : un fichier présent (code 1) comme une panne de Docker (125, 126, 127) arrêtent l'étape,
        # car GitHub lance ce script avec `bash -e`. Un `if docker run ...; then` prenait une panne pour un succès.
        run: |
          docker run --rm --entrypoint sh rita-api:verification -c 'test ! -e /app/.env'
          echo "/app/.env absent de l'image"

      - name: Vérifier que l'image embarque ses fichiers de déploiement
        # Le script du serveur extrait ces deux fichiers de l'image livrée (tâche 8) : sans eux, aucune bascule.
        run: |
          docker run --rm --entrypoint sh rita-api:verification -c 'test -f /app/deploy/docker-compose.yml && test -f /app/deploy/compose.prod.yml'
          echo "fichiers de déploiement présents dans l'image"

      - name: Arrêter le conteneur de vérification
        if: always()
        run: docker rm -f verification || true

      # --- La publication -------------------------------------------------
      # Seulement sur un tag, et seulement si les deux vérifications sont passées
      # (une étape en échec arrête le job avant d'arriver ici).
      - name: S'authentifier sur le registre
        # Juste avant de publier : une connexion inutile est une permission
        # accordée pour rien.
        if: startsWith(github.ref, 'refs/tags/livrable-')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image vérifiée
        if: startsWith(github.ref, 'refs/tags/livrable-')
        env:
          ETIQUETTES: ${{ steps.etiquettes.outputs.tags }}
        run: |
          printf '%s\n' "$ETIQUETTES" | while read -r etiquette; do
            [ -n "$etiquette" ] && docker push "$etiquette"
          done

      - name: Résumé
        run: |
          {
            echo "### Livraison"
            echo ""
            if [ "${{ startsWith(github.ref, 'refs/tags/livrable-') }}" = "true" ]; then
              echo "**Image publiee** sur \`${{ env.REGISTRE }}/${{ env.IMAGE }}\`"
              echo ""
              echo '```'
              echo "${{ steps.etiquettes.outputs.tags }}"
              echo '```'
            else
              echo "**Construction verifiee**, sans publication."
              echo ""
              echo "La publication n'a lieu que sur un tag \`livrable-*\`."
            fi
            echo ""
            echo "- L'API demarre et repond sur \`/health\`"
            echo "- L'acces sans cle est refuse (403)"
          } >> "$GITHUB_STEP_SUMMARY"
