# Revue adversariale de chaque pull request vers main — compétence C13/C17.
# Le relecteur est Claude Code (GitHub Action officielle), authentifié par le jeton
# d'abonnement CLAUDE_CODE_OAUTH_TOKEN (secret du dépôt, jamais dans ce fichier).
# Il lit AGENTS.md et CLAUDE.md du dépôt : ce sont sa grille de lecture.
# Même choix que la conception Mardik ③ du 18/09 : ici il tourne pour de vrai.
name: Revue PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: revue-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  revue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sortie de Claude visible dans le log du run (19/09 : deux revues « succes » sans rien
          # publier, cause invisible). Depot prive : rien de sensible n'est expose.
          show_full_output: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
