# =============================================================================
# RETOUR ARRIÈRE EN UNE OPÉRATION (sprint 2, tâche 9) : critère 4 de la grille
#
# Onglet Actions > « Retour arrière » > Run workflow, avec son nom et le motif. Le serveur remet la version précédente
# validée, la contrôle avec sa propre clé, et l'écrit dans son journal ; si elle échoue, la version de départ revient.
# Comme `rollback.yml` de Mardik v2 : le nom et le motif restent dans GitHub, le serveur ne reçoit que le numéro du
# passage. Secours si GitHub est indisponible : la même commande lancée sur le serveur (docs/exploitation.md#rollback-production).
# =============================================================================

name: Retour arrière

on:
  workflow_dispatch:
    inputs:
      acteur:
        description: "Qui demande le retour arrière"
        required: true
        type: string
      motif:
        description: "Pourquoi revenir à la version précédente"
        required: true
        type: string

jobs:
  revenir:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: production
      url: https://178-104-184-125.sslip.io
    # Son PROPRE groupe : GitHub remplace une exécution en attente par la suivante du même groupe ; dans le groupe
    # `production`, un retour en attente derrière une livraison pourrait être annulé par la livraison suivante.
    # L'exclusion entre livraison et retour est assurée par le verrou du serveur.
    concurrency:
      group: retour-arriere
      cancel-in-progress: false
    # Le serveur attend le verrou au plus ATTENTE_VERROU["revenir"], puis travaille au plus DUREE_MAX_REVENIR
    # (deploy/deployer.py) : environ 111 minutes depuis le sprint 3 (une ingestion peut tenir le verrou, et chaque
    # contrôle pose une question) ; le travail ne doit pas être coupé avant lui.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Noter qui demande le retour et pourquoi
        env:
          ACTEUR: ${{ inputs.acteur }}
          MOTIF: ${{ inputs.motif }}
        run: |
          {
            echo "### Retour arriere demande"
            echo ""
            printf -- '- par : %s\n' "$ACTEUR"
            printf -- '- motif : %s\n' "$MOTIF"
            printf -- '- passage : %s\n' "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revenir à la version précédente
        uses: ./.github/actions/ordre-serveur
        with:
          ordre: revenir
          argument: ${{ github.run_id }}
          cle-ssh: ${{ secrets.DEPLOY_SSH_KEY }}
          hote: ${{ secrets.DEPLOY_HOST }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          empreinte-bloquante: "false"
          accepter-report: "false"
