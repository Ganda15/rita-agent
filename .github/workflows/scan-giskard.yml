# =============================================================================
# SCAN DE VULNÉRABILITÉS GISKARD — C10 / C17 (OWASP LLM Top 10), C21 (incidents)
#
# Déclenchement MANUEL seulement : le scan appelle un modèle (générateur d'attaques et
# juge), donc il coûte. Il tourne en CI et non sur le poste d'Era parce que `giskard[scan]`
# tire garak et deepteam, donc torch — des roues refusées par Smart App Control.
#
# Ce qu'il produit : `rapport-giskard.json` en artefact du run (la preuve brute), et le
# tableau par catégorie dans le journal. L'import dans `evals/cas_giskard.py` se fait
# ensuite, en local, après relecture de 20 attaques à la main :
#   C:/Python314/python.exe -m evals.importer_giskard rapport-giskard.json
#
# Secret requis : OPENROUTER_API_KEY (la clé existante de RITA). Modèle du juge : chaîne
# litellm lue par giskard-checks dans GISKARD_CHECKS_DEFAULT_MODEL.
# =============================================================================
name: Scan Giskard

on:
  workflow_dispatch:
    inputs:
      max_scenarios:
        description: "Plafond total de scénarios (coût du juge). 200 = premier run validé par Era le 20/09/2026."
        default: "200"
        required: true
      langues:
        description: "Langues attendues de l'agent, séparées par des virgules"
        default: "fr,en"
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer RITA et Giskard (scan + litellm)
        run: |
          pip install -r requirements.txt
          pip install "giskard[scan,litellm]"
          python -c "import giskard.scan, litellm; print('giskard scan OK')"
      - name: Lancer le scan contre les garde-fous
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GISKARD_CHECKS_DEFAULT_MODEL: openrouter/anthropic/claude-sonnet-4.5
          # L'API RITA n'est pas lancée : la cible est la chaîne de garde-fous, sans modèle.
          RITA_API_KEY: cle-de-test-scan-giskard-32-caracteres
        run: python -m evals.scan_giskard --max-scenarios "${{ inputs.max_scenarios }}" --langues "${{ inputs.langues }}" --sortie rapport-giskard.json
      - name: Résumé par catégorie (le tableau de la preuve)
        run: python -m evals.importer_giskard rapport-giskard.json --sortie cas_giskard_apercu.py
      - name: Conserver le rapport brut
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-giskard
          path: |
            rapport-giskard.json
            cas_giskard_apercu.py
          retention-days: 90
