name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Installer le navigateur du smoke test (C17, item 7 du harnais)
        # Playwright + Chromium. En local : le Chrome installé (canal `chrome`), rien à télécharger.
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Installer giskard-llm (pur Python) pour tester la déclaration du juge OpenRouter
        run: pip install "giskard-llm[openai]" giskard-checks
      - name: Lancer les tests et mesurer la couverture
        # Le seuil vit dans `.coveragerc` (`fail_under = 80`), pas ici : un seuil
        # écrit dans le workflow serait invisible depuis la machine de développement,
        # et on découvrirait la régression en CI plutôt qu'avant de pousser.
        run: pytest -v --cov --cov-report=term-missing

  # Porte de qualité : la mesure des garde-fous bloque le merge si elle régresse.
  # Standard Velmo 2.0 — une porte d'évaluation à chaque transition de branche.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Mesurer les garde-fous
        run: python -m evals.mesurer_gardefou
      - name: Gates non compensables
        run: pytest tests/test_evals.py -v
