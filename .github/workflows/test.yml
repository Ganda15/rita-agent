name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Installer le navigateur du smoke test (C17, item 7 du harnais)
        # Playwright + Chromium. En local : le Chrome installé (canal `chrome`), rien à télécharger.
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Installer giskard-llm (pur Python) pour tester la déclaration du juge OpenRouter
        run: pip install "giskard-llm[openai]" giskard-checks
      - name: Tester les données (collecte, nettoyage, import, RGPD)
        # Critère C13 (rapport E3) : l'étape de test des données est une étape nommée, et elle passe
        # AVANT la suite complète, pour qu'un défaut de données arrête la chaîne en premier et se lise
        # comme tel. Ces tests tournent aussi dans la suite complète, avec la couverture : quelques
        # secondes de plus, pour une étape qu'on peut lire seule. Les tests qui exigent une base se
        # sautent en CI (pas de DATABASE_URL), comme dans la suite complète.
        run: >-
          pytest -q --no-cov
          tests/test_ingest.py tests/test_importer.py tests/test_cotations.py tests/test_ecb.py
          tests/test_fred.py tests/test_rss.py tests/test_scraper.py tests/test_positions.py
          tests/test_schema.py tests/test_marches.py tests/test_fraicheur.py
          tests/test_manifeste_collecte.py tests/test_journal_pipeline.py tests/test_rattrapage.py
          tests/test_cas_chapitre_donnees.py tests/test_vue_valorisation.py tests/test_rgpd_purge.py
          tests/test_rgpd_registre.py tests/test_database.py
      - name: Lancer les tests et mesurer la couverture
        # Le seuil vit dans `.coveragerc` (`fail_under = 80`), pas ici : un seuil
        # écrit dans le workflow serait invisible depuis la machine de développement,
        # et on découvrirait la régression en CI plutôt qu'avant de pousser.
        run: pytest -v --cov --cov-report=term-missing

  # Porte de qualité : la mesure des garde-fous bloque le merge si elle régresse.
  # Standard Velmo 2.0 — une porte d'évaluation à chaque transition de branche.
  evals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Mesurer les garde-fous
        run: python -m evals.mesurer_gardefou
      - name: Gates non compensables
        run: pytest tests/test_evals.py -v

  # Les tests qui exigent PostgreSQL (01/11/2026, défaut #79). Sans ce job, ils se sautaient en CI et la chaîne restait
  # verte sans les avoir exécutés. Base jetable de la version de production, schéma et rôles du dépôt, données fictives
  # créées puis annulées par chaque test. Aucun mot de passe : mode `trust`, sur un service que seul ce job atteint.
  # Un test sauté fait échouer le job : une base indisponible ne donne plus une validation verte.
  base:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rita
          POSTGRES_DB: rita_recette
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rita -d rita_recette"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://rita@localhost:5432/rita_recette
      RITA_BASE_DE_TEST: rita_recette
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Charger le schéma puis les rôles du dépôt
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/roles.sql
      - name: Lancer tous les tests qui demandent une base, sans aucun saut
        run: |
          set -o pipefail
          fichiers=$(grep -l dsn_de_test tests/*.py | grep -v garde_base.py)
          pytest -q -rs --no-cov $fichiers | tee sortie-base.txt
          if grep -E "[0-9]+ skipped" sortie-base.txt; then echo "Des tests de base ont été sautés : échec." && exit 1; fi
